name: Release

# Fase 6.4: uma tag `vX.Y.Z` produz os instaladores dos 3 OS e os anexa a um
# GitHub Release em rascunho. Nada e publicado automaticamente — o rascunho e
# revisado a mao antes de virar release publico.
#
# Tags com sufixo (`v0.1.0-rc.1`) viram pre-release e servem pra exercitar o
# workflow inteiro sem queimar a versao final.
on:
  push:
    tags:
      - 'v*'

# `create-release` e o `tauri-action` escrevem no Releases.
permissions:
  contents: write

jobs:
  version:
    # A tag e a unica fonte da verdade da versao. Os manifestos guardam
    # `0.0.0` e recebem o valor derivado daqui no job de build, logo antes de o
    # bundler ler — nao existe bump commitado pra divergir da tag, entao nao
    # existe guard.
    #
    # Roda em ~5s e falha antes dos ~90 min de nvcc se a tag tiver formato
    # invalido (`v1`, `release-2`), caso em que os manifestos ficariam com uma
    # versao que o bundler do MSI recusa no fim do job.
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      # Sem checkout: nada aqui le arquivo do repo.
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # `0.1.0-rc.1` -> `0.1.0`: o sufixo de pre-release vive somente na
          # tag e no nome do release, nunca nos manifestos.
          base="${tag%%-*}"

          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::a tag $GITHUB_REF_NAME nao tem a forma vX.Y.Z[-sufixo]"
            exit 1
          fi

          echo "tag=$GITHUB_REF_NAME  version=$tag  manifestos=$base"

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    # Um job so cria o release e os 3 builds anexam nele via `releaseId`. Se
    # cada runner criasse o proprio, os 3 correriam pra mesma tag e dois
    # falhariam (ou pior, criariam releases duplicados).
    name: Create draft release
    needs: version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # O corpo vive em `.github/RELEASE_NOTES.md`: os instaladores nao sao
          # assinados (CLAUDE.md 2.5) e, sem as instrucoes de bypass, a primeira
          # execucao morre num alerta do SO e o usuario casual desiste ali.
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Abraxas v$VERSION" \
            -f body="$(cat .github/RELEASE_NOTES.md)" \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            --jq .id)

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Draft release #$release_id criado para $GITHUB_REF_NAME"

  build:
    # Combo de producao por OS (CLAUDE.md 2.4): um instalador por sistema, com
    # os backends daquele sistema compilados juntos e escolhidos em runtime.
    name: ${{ matrix.name }}
    needs: [version, create-release]
    strategy:
      # Um OS quebrado nao deve descartar os outros dois: o rascunho fica com
      # os artefatos que deram certo e o OS problematico e reprocessado depois.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --features metal --bundles dmg
          - name: Windows (CUDA + Vulkan)
            # `windows-2022`, nao `windows-latest`: o `windows-latest` migrou pro
            # Windows Server 2025 com Visual Studio 2026, e o
            # `visual_studio_integration` do CUDA 12.6 so cobre ate o VS2022 —
            # o CMake do llama.cpp morre em "No CUDA toolset found".
            os: windows-2022
            args: --features cuda,vulkan --bundles nsis,msi
          - name: Linux (Vulkan)
            # 22.04, nao `ubuntu-latest`: o AppImage herda a glibc do runner que
            # o produziu. Compilado no 24.04 (glibc 2.39) ele nao abre em Ubuntu
            # 22.04 nem Debian 12 — exatamente as distros do usuario casual.
            os: ubuntu-22.04
            #
            # Sem `cuda` aqui, ao contrario do Windows: o `libggml-cuda.so`
            # carrega `DT_NEEDED libcuda.so.1` (o `ggml-cuda/CMakeLists.txt`
            # linka `CUDA::cuda_driver`), que vem do driver NVIDIA e nao existe
            # no runner — so o stub `lib64/stubs/libcuda.so`, com o nome errado
            # e fora do `LD_LIBRARY_PATH`. O linuxdeploy resolve o `DT_NEEDED`
            # de todo ELF do AppDir e trata dependencia ausente como erro fatal
            # (mesma classe de falha que o `$ORIGIN` do build.rs resolve pro
            # `libggml-base.so.0`, so que esta nao tem conserto por rpath: a
            # lib do driver nao pode entrar no bundle, sob pena de sombrear a
            # do sistema em runtime). Foi assim que a v0.1.5 morreu depois de
            # 73 min de build, com o `.deb` ja pronto e descartado junto.
            #
            # Nem seria util resolver: o `ggml-cuda` tambem precisa de
            # `libcudart.so.12` e `libcublas.so.12` na maquina do usuario, que
            # nao vem com driver NVIDIA nenhum e somam ~700 MB se bundladas.
            # Usuario casual nao tem CUDA Toolkit instalado, entao o `dlopen`
            # do modulo falharia e o ggml cairia no Vulkan de qualquer forma —
            # que e o que passa a ser escolhido direto. NVIDIA no Linux
            # continua com GPU: o driver traz o ICD Vulkan.
            #
            # `--verbose` porque o `tauri-bundler` engole o stderr do
            # linuxdeploy quando o log level e Error e reporta so
            # "failed to run linuxdeploy" — foi o que custou um ciclo inteiro
            # de release pra diagnosticar. Espelha o `ci.yml`.
            args: --verbose --features vulkan --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    # Com o cache do build nativo quente o Windows fecha em ~15 min; o teto
    # continua dimensionado pro caminho frio, que e o que sobra quando a
    # entrada foi despejada por LRU ou o `Cargo.lock` mudou sem o
    # `warm-release-cache.yml` ter rodado depois.
    #
    # 150, nao 120: o Windows da v0.1.2 fechou em 1h31 com o Vulkan SDK
    # 1.3.290.0. O 1.4.357.0 traz um glslc que aceita mais extensoes
    # (coopmat2, bfloat16, e2m1/e4m3), e cada uma que passa o
    # `test_shader_extension_support` do ggml-vulkan adiciona variantes de
    # shader ao `vulkan-shaders-gen` — os 29 min de folga que sobravam nao
    # cobrem isso com confianca.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Antes do stamp de versao de proposito: o `set-version.sh` reescreve o
      # `src-tauri/Cargo.lock`, e a chave de cache derivada aqui e a mesma que o
      # `warm-release-cache.yml` deriva do lock *commitado*. Rodar depois do
      # stamp faria a chave exata errar em toda tag, deixando so o fallback.
      #
      # A action e a fonte unica do ambiente (CUDA, Vulkan SDK, gerador do
      # CMake, `CARGO_TARGET_DIR`) e da lista de arquiteturas — o que antes
      # eram seis passos aqui, duplicados no workflow que aquece o cache.
      - name: Windows GPU toolchain (CUDA + Vulkan)
        id: toolchain
        if: matrix.os == 'windows-2022'
        uses: ./.github/actions/windows-gpu-toolchain

      # `cache/restore`, nao `cache`: quem produz a entrada e o
      # `warm-release-cache.yml`. Salvar aqui tambem gravaria uma segunda copia
      # multi-GB por tag numa cota de 10 GB por repositorio, despejando por LRU
      # justamente a entrada que os proximos releases querem encontrar.
      #
      # Um miss nao falha o job — so devolve o build frio de ~95 min. O passo
      # seguinte torna isso visivel no log em vez de deixar a lentidao sem
      # explicacao.
      - name: Restore the llama.cpp native build
        id: native-cache
        if: matrix.os == 'windows-2022'
        uses: actions/cache/restore@v4
        with:
          path: |
            D:\ct
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.toolchain.outputs.cache-key }}
          restore-keys: ${{ steps.toolchain.outputs.cache-restore-key }}

      - name: Report the native build cache state
        if: matrix.os == 'windows-2022'
        shell: bash
        env:
          HIT: ${{ steps.native-cache.outputs.cache-hit }}
          MATCHED: ${{ steps.native-cache.outputs.cache-matched-key }}
          WANTED: ${{ steps.toolchain.outputs.cache-key }}
        run: |
          set -euo pipefail
          if [[ "$HIT" == "true" ]]; then
            echo "Cache exato: $MATCHED — o nvcc nao roda, o build fecha em ~15 min."
          elif [[ -n "$MATCHED" ]]; then
            echo "::notice::Hit parcial ($MATCHED em vez de $WANTED): o llama.cpp vem pronto, so os crates Rust recompilam."
          else
            echo "::warning::Nenhum cache para $WANTED — build frio de ~95 min. Rode o workflow 'Warm release cache' antes da proxima tag."
          fi

      - name: Stamp version from tag
        # Primeiro passo depois do checkout: o `src-tauri/Cargo.toml` versionado
        # declara `0.0.0` e e daqui que a versao real entra. Se este passo nao
        # rodar, os instaladores saem como `Abraxas_0.0.0_x64.msi` e a tela de
        # settings (que le `CARGO_PKG_VERSION`) mostra 0.0.0.
        #
        # Roda nos tres OS: cada runner faz o seu proprio checkout, entao cada
        # um precisa gravar. Nada disso e commitado.
        shell: bash
        run: ./scripts/set-version.sh "$GITHUB_REF_NAME"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        # Mesmas deps do ci.yml. `libfuse2` e extra: o linuxdeploy que empacota
        # o AppImage precisa de FUSE 2, que o CI (que so faz `cargo check`)
        # nunca exercita. `patchelf` tambem: o `build.rs` usa ele pra dar um
        # rpath `$ORIGIN` as bibliotecas do ggml, sem o qual o linuxdeploy nao
        # resolve as dependencias dos modulos e o AppImage nao fecha (ADR 0001).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev \
            libfuse2 \
            patchelf

      # Windows tem o Vulkan SDK instalado pela action composta acima, junto do
      # CUDA e dos guards que so fazem sentido la. Aqui sobra o Linux.
      #
      # `1.4.357.0` pelo mesmo motivo do ci.yml: o llama.cpp do `llama-cpp-2`
      # 0.1.155 exige `find_package(SPIRV-Headers CONFIG REQUIRED)`, e o SDK
      # 1.3.290.0 nao traz o `SPIRV-HeadersConfig.cmake` — foi assim que a tag
      # v0.1.4 morreu no build script do `llama-cpp-sys-2`. A versao aparece em
      # tres lugares (aqui, na action composta e no `ci.yml`); mexer num sem
      # mexer nos outros e bug.
      - name: Install Vulkan SDK (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.4.357.0'
          install_runtime: true
          cache: true
          stripdown: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Sem `Swatinem/rust-cache`: no Windows ele nem enxergaria o alvo, que
      # esta em `D:\ct` (ele resolve o target dir relativo a raiz da workspace),
      # e o `cache/restore` la em cima ja cobre alvo e registry. macOS e Linux
      # ficam sem cache de proposito — fecham em 8 e 19 min, entao o que se
      # economizaria nao paga o risco de um artefato publico sair de um estado
      # parcialmente restaurado.
      #
      # (Nota historica: o "Cache service responded with 400" que motivava
      # evitar cache aqui nao era instabilidade do runner Windows — era o cache
      # interno do `Jimver/cuda-toolkit` batendo na v1 da API de cache, ja
      # desligada. A action composta desliga esse caminho com
      # `use-github-cache: false`.)

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      - name: Verify macOS bundle is properly ad-hoc signed
        if: matrix.os == 'macos-latest'
        # O dmg da v0.1.0 subiu com o `.app` carregando apenas a assinatura
        # ad-hoc que o linker do Rust deixa no executavel — sem `_CodeSignature`
        # no bundle. `codesign --verify` recusava com "code has no resources but
        # signature indicates they must be present", e o macOS traduz isso pro
        # usuario como "'Abraxas.app' esta danificado e nao pode ser aberto",
        # que nao tem bypass: o caminho de *Abrir mesmo assim* nem aparece.
        #
        # O `signingIdentity: "-"` no tauri.conf.json faz o bundler rodar
        # `codesign --force -s -`, selando Info.plist e recursos. Este passo
        # existe pra falhar a tag caso essa config se perca num refactor — o
        # sintoma so apareceria na maquina do usuario.
        #
        # Nao substitui notarizacao: o app continua nao notarizado e o Gatekeeper
        # continua exigindo *Abrir mesmo assim* na primeira execucao (esperado,
        # CLAUDE.md 2.5). A diferenca e que agora esse caminho existe.
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly "$dmg" -mountpoint "$mnt" >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT

          codesign --verify --deep --strict --verbose=2 "$mnt/Abraxas.app"

          if ! codesign -dvv "$mnt/Abraxas.app" 2>&1 | grep -q 'Sealed Resources version='; then
            echo "::error::Abraxas.app nao tem recursos selados — o macOS vai reportar 'danificado'."
            exit 1
          fi
          echo "Assinatura ad-hoc valida e recursos selados."
