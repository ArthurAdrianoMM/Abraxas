name: Release

# Fase 6.4: uma tag `vX.Y.Z` produz os instaladores dos 3 OS e os anexa a um
# GitHub Release em rascunho. Nada e publicado automaticamente — o rascunho e
# revisado a mao antes de virar release publico.
#
# Tags com sufixo (`v0.1.0-rc.1`) viram pre-release e servem pra exercitar o
# workflow inteiro sem queimar a versao final.
on:
  push:
    tags:
      - 'v*'

# `create-release` e o `tauri-action` escrevem no Releases.
permissions:
  contents: write

jobs:
  guard:
    # Roda em ~10s e aborta antes dos ~90 min de nvcc caso a tag e as versoes
    # declaradas tenham divergido. Sem isso, a divergencia so apareceria no
    # nome dos artefatos, depois do build inteiro.
    name: Version guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # `0.1.0-rc.1` -> `0.1.0`: o sufixo de pre-release nao existe nos
          # manifestos, so na tag.
          base="${tag%%-*}"

          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)

          echo "tag=$tag (base $base)  package.json=$pkg  tauri.conf.json=$conf  Cargo.toml=$cargo"

          for pair in "package.json:$pkg" "tauri.conf.json:$conf" "Cargo.toml:$cargo"; do
            if [[ "${pair#*:}" != "$base" ]]; then
              echo "::error::${pair%%:*} declara ${pair#*:}, mas a tag e $GITHUB_REF_NAME"
              exit 1
            fi
          done

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    # Um job so cria o release e os 3 builds anexam nele via `releaseId`. Se
    # cada runner criasse o proprio, os 3 correriam pra mesma tag e dois
    # falhariam (ou pior, criariam releases duplicados).
    name: Create draft release
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # O corpo vive em `.github/RELEASE_NOTES.md`: os instaladores nao sao
          # assinados (CLAUDE.md 2.5) e, sem as instrucoes de bypass, a primeira
          # execucao morre num alerta do SO e o usuario casual desiste ali.
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Abraxas v$VERSION" \
            -f body="$(cat .github/RELEASE_NOTES.md)" \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            --jq .id)

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Draft release #$release_id criado para $GITHUB_REF_NAME"

  build:
    # Combo de producao por OS (CLAUDE.md 2.4): um instalador por sistema, com
    # os backends daquele sistema compilados juntos e escolhidos em runtime.
    name: ${{ matrix.name }}
    needs: [guard, create-release]
    strategy:
      # Um OS quebrado nao deve descartar os outros dois: o rascunho fica com
      # os artefatos que deram certo e o OS problematico e reprocessado depois.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --features metal --bundles dmg
          - name: Windows (CUDA + Vulkan)
            # `windows-2022`, nao `windows-latest`: o `windows-latest` migrou pro
            # Windows Server 2025 com Visual Studio 2026, e o
            # `visual_studio_integration` do CUDA 12.6 so cobre ate o VS2022 —
            # o CMake do llama.cpp morre em "No CUDA toolset found".
            os: windows-2022
            args: --features cuda,vulkan --bundles nsis,msi
          - name: Linux (CUDA + Vulkan)
            # 22.04, nao `ubuntu-latest`: o AppImage herda a glibc do runner que
            # o produziu. Compilado no 24.04 (glibc 2.39) ele nao abre em Ubuntu
            # 22.04 nem Debian 12 — exatamente as distros do usuario casual.
            os: ubuntu-22.04
            args: --features cuda,vulkan --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    # nvcc com a lista completa de arquiteturas e o gargalo; o default de 6h e
    # generoso demais pra um job travado.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        # Mesmas deps do ci.yml. `libfuse2` e extra: o linuxdeploy que empacota
        # o AppImage precisa de FUSE 2, que o CI (que so faz `cargo check`)
        # nunca exercita.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev \
            libfuse2

      # Instalacao do CUDA espelha o ci.yml, inclusive os workarounds:
      # `visual_studio_integration` no Windows (senao o CMake nao acha o toolset
      # CUDA do VS2022) e cuBLAS via apt no Linux (os aliases da action apontam
      # pros nomes antigos `cuda-cublas-*`).
      - name: Install CUDA Toolkit (Windows)
        if: matrix.os == 'windows-2022'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Install CUDA Toolkit (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Install cuBLAS (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get install -y libcublas-12-8 libcublas-dev-12-8

      - name: Install Vulkan SDK
        if: matrix.os != 'macos-latest'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.3.290.0'
          install_runtime: true
          cache: true
          stripdown: true

      - name: Set CUDA build flags
        if: matrix.os != 'macos-latest'
        # O ci.yml usa `75-real` (uma arquitetura) so pra provar que compila e
        # linka. Num release precisamos de cobertura real de GPU — mas nao da
        # lista inteira: `61;70;75;80;86;89;90` gera cubin *e* PTX pra cada uma
        # das 7 arquiteturas e produziu um `abraxas.exe` de 1,29 GB, no qual o
        # makensis morre em "Internal compiler error #12345: error mmapping
        # file (1293887906, 33554432) is out of range".
        #
        # A lista abaixo e `-real` (so cubin, sem PTX por arch) nas quatro
        # geracoes de GPU de consumidor + Blackwell, mais um unico
        # `90-virtual` que deixa PTX embarcado como rede de seguranca pra
        # arquiteturas >= 9.0 que nao existiam neste build:
        #
        #   sm_61  Pascal      GTX 10xx
        #   sm_75  Turing      RTX 20xx, GTX 16xx
        #   sm_86  Ampere      RTX 30xx        (cobre sm_87 tambem)
        #   sm_89  Ada         RTX 40xx
        #   sm_120 Blackwell   RTX 50xx        (exige nvcc >= 12.8)
        #   compute_90 (PTX)   Hopper e o que vier depois, via JIT
        #
        # O que ficou fora — Maxwell (5.x), P100 (6.0), Volta (7.0) e A100
        # (8.0) — nao tem kernel neste binario. `hardware::gpu::detect`
        # conhece essa lista (`ComputeCapability::has_cuda_kernel`) e manda
        # essas GPUs pro Vulkan em vez de deixar o ggml estourar em runtime
        # com "no kernel image is available for execution on the device".
        # Mexer numa lista sem mexer na outra e bug: elas sao um par.
        #
        # CMAKE_POSITION_INDEPENDENT_CODE: os objetos `.cu` do llama.cpp sao
        # compilados sem -fPIC por default e o link do executavel (PIE, no
        # Linux) falha com "relocation R_X86_64_PC32 cannot be used against
        # symbol 'stderr'; recompile with -fPIC". O CMake traduz isso pra
        # `-Xcompiler=-fPIC` no nvcc. O `build.rs` do llama-cpp-sys-2 repassa
        # qualquer variavel de ambiente `CMAKE_*` como `-D` pro CMake.
        shell: bash
        run: |
          echo "CMAKE_CUDA_ARCHITECTURES=61-real;75-real;86-real;89-real;120-real;90-virtual" >> "$GITHUB_ENV"
          echo "CMAKE_POSITION_INDEPENDENT_CODE=ON" >> "$GITHUB_ENV"

      - name: Check nvcc supports every arch in the list
        if: matrix.os != 'macos-latest'
        # Roda em ~5s e falha cedo. `sm_120` (Blackwell) exige nvcc >= 12.8: se
        # o toolkit for repinado pra baixo, ou uma arquitetura nova entrar na
        # lista antes de o compilador conhece-la, sem este passo a descoberta
        # vem depois de ~90 min de nvcc, no fim do job.
        #
        # `--list-gpu-code` / `--list-gpu-arch` em vez de compilar um `.cu` de
        # teste: no Windows o runner roda bash sem o ambiente do MSVC, e
        # qualquer compilacao de verdade morreria em "Cannot find compiler
        # 'cl.exe' in PATH" — um falso negativo pior que o bug que estamos
        # tentando pegar. Estas duas flags nao tocam no host compiler.
        #
        # A lista vem do `$GITHUB_ENV` do passo anterior; nao existe segunda
        # copia aqui pra sair de sincronia.
        shell: bash
        run: |
          set -euo pipefail
          nvcc --version | tail -2

          codes=$(nvcc --list-gpu-code)
          arches=$(nvcc --list-gpu-arch)
          missing=()

          IFS=';' read -ra archs <<<"$CMAKE_CUDA_ARCHITECTURES"
          for arch in "${archs[@]}"; do
            n="${arch%%-*}"
            case "$arch" in
              # `-virtual` embarca PTX: precisa existir como compute_NN.
              *-virtual) grep -qx "compute_$n" <<<"$arches" || missing+=("compute_$n") ;;
              # `-real` e a forma sem sufixo geram cubin: precisa de sm_NN.
              *)         grep -qx "sm_$n"      <<<"$codes"  || missing+=("sm_$n") ;;
            esac
          done

          if (( ${#missing[@]} )); then
            echo "::error::nvcc nao suporta: ${missing[*]} (CMAKE_CUDA_ARCHITECTURES=$CMAKE_CUDA_ARCHITECTURES)"
            exit 1
          fi
          echo "nvcc suporta todas as arquiteturas de $CMAKE_CUDA_ARCHITECTURES"

      # Mesmo motivo do ci.yml, os dois ajustes vem em par.
      #
      # CMAKE_GENERATOR=Ninja: o `vulkan-shaders-gen` do llama.cpp e um
      # `ExternalProject_Add`, e o MSBuild do gerador Visual Studio roda os
      # custom build steps dele em nos paralelos fora de ordem — o `install`
      # dispara antes de o `configure` escrever o `cmake_install.cmake` e o
      # build morre em MSB8066. O Ninja respeita o grafo de stamps.
      #
      # CARGO_TARGET_DIR: com o Ninja o CMake passa a rodar de fato o
      # try-compile de deteccao do compilador, que aninha mais dois niveis sob
      # o prefixo do ExternalProject e estoura o MAX_PATH — o cl.exe morre em
      # "C1083: Cannot open compiler generated file: ''". `D:\ct` no lugar de
      # `D:\a\Abraxas\Abraxas\src-tauri\target` devolve 32 caracteres.
      # O `tauri-action` le `CARGO_TARGET_DIR` (tem precedencia sobre o
      # .cargo/config) e acha os bundles no lugar novo.
      - name: Windows build environment (Ninja + short target dir)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_DIR=D:\ct' >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Sem `Swatinem/rust-cache` de proposito: release e build limpo, e o
      # cache do runner Windows ja se mostrou instavel no ci.yml ("Cache
      # service responded with 400"). Um cache parcialmente restaurado num
      # artefato que vai pro publico nao vale os minutos economizados.

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
