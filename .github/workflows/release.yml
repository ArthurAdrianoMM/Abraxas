name: Release

# Fase 6.4: uma tag `vX.Y.Z` produz os instaladores dos 3 OS e os anexa a um
# GitHub Release em rascunho. Nada e publicado automaticamente — o rascunho e
# revisado a mao antes de virar release publico.
#
# Tags com sufixo (`v0.1.0-rc.1`) viram pre-release e servem pra exercitar o
# workflow inteiro sem queimar a versao final.
on:
  push:
    tags:
      - 'v*'

# `create-release` e o `tauri-action` escrevem no Releases.
permissions:
  contents: write

jobs:
  guard:
    # Roda em ~10s e aborta antes dos ~90 min de nvcc caso a tag e as versoes
    # declaradas tenham divergido. Sem isso, a divergencia so apareceria no
    # nome dos artefatos, depois do build inteiro.
    name: Version guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # `0.1.0-rc.1` -> `0.1.0`: o sufixo de pre-release nao existe nos
          # manifestos, so na tag.
          base="${tag%%-*}"

          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)

          echo "tag=$tag (base $base)  package.json=$pkg  tauri.conf.json=$conf  Cargo.toml=$cargo"

          for pair in "package.json:$pkg" "tauri.conf.json:$conf" "Cargo.toml:$cargo"; do
            if [[ "${pair#*:}" != "$base" ]]; then
              echo "::error::${pair%%:*} declara ${pair#*:}, mas a tag e $GITHUB_REF_NAME"
              exit 1
            fi
          done

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    # Um job so cria o release e os 3 builds anexam nele via `releaseId`. Se
    # cada runner criasse o proprio, os 3 correriam pra mesma tag e dois
    # falhariam (ou pior, criariam releases duplicados).
    name: Create draft release
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # O corpo vive em `.github/RELEASE_NOTES.md`: os instaladores nao sao
          # assinados (CLAUDE.md 2.5) e, sem as instrucoes de bypass, a primeira
          # execucao morre num alerta do SO e o usuario casual desiste ali.
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Abraxas v$VERSION" \
            -f body="$(cat .github/RELEASE_NOTES.md)" \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            --jq .id)

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Draft release #$release_id criado para $GITHUB_REF_NAME"

  build:
    # Combo de producao por OS (CLAUDE.md 2.4): um instalador por sistema, com
    # os backends daquele sistema compilados juntos e escolhidos em runtime.
    name: ${{ matrix.name }}
    needs: [guard, create-release]
    strategy:
      # Um OS quebrado nao deve descartar os outros dois: o rascunho fica com
      # os artefatos que deram certo e o OS problematico e reprocessado depois.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --features metal --bundles dmg
          - name: Windows (CUDA + Vulkan)
            os: windows-latest
            args: --features cuda,vulkan --bundles nsis,msi
          - name: Linux (CUDA + Vulkan)
            # 22.04, nao `ubuntu-latest`: o AppImage herda a glibc do runner que
            # o produziu. Compilado no 24.04 (glibc 2.39) ele nao abre em Ubuntu
            # 22.04 nem Debian 12 — exatamente as distros do usuario casual.
            os: ubuntu-22.04
            args: --features cuda,vulkan --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    # nvcc com a lista completa de arquiteturas e o gargalo; o default de 6h e
    # generoso demais pra um job travado.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        # Mesmas deps do ci.yml. `libfuse2` e extra: o linuxdeploy que empacota
        # o AppImage precisa de FUSE 2, que o CI (que so faz `cargo check`)
        # nunca exercita.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev \
            libfuse2

      # Instalacao do CUDA espelha o ci.yml, inclusive os workarounds:
      # `visual_studio_integration` no Windows (senao o CMake nao acha o toolset
      # CUDA do VS2022) e cuBLAS via apt no Linux (os aliases da action apontam
      # pros nomes antigos `cuda-cublas-*`).
      - name: Install CUDA Toolkit (Windows)
        if: matrix.os == 'windows-latest'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Install CUDA Toolkit (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Install cuBLAS (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get install -y libcublas-12-6 libcublas-dev-12-6

      - name: Install Vulkan SDK
        if: matrix.os != 'macos-latest'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.3.290.0'
          install_runtime: true
          cache: true
          stripdown: true

      - name: Set CUDA architectures
        if: matrix.os != 'macos-latest'
        # O ci.yml usa `75` (uma arquitetura) so pra provar que linka. Num
        # release isso deixaria a maioria das GPUs NVIDIA sem kernel e caindo
        # em CPU silenciosamente. Aqui: Pascal (GTX 10xx) ate Hopper/Ada.
        shell: bash
        run: echo "CMAKE_CUDA_ARCHITECTURES=61;70;75;80;86;89;90" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Sem `Swatinem/rust-cache` de proposito: release e build limpo, e o
      # cache do runner Windows ja se mostrou instavel no ci.yml ("Cache
      # service responded with 400"). Um cache parcialmente restaurado num
      # artefato que vai pro publico nao vale os minutos economizados.

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
