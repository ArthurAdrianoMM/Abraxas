name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        # `libclang-dev` is required by `bindgen` (pulled in by
        # `llama-cpp-sys-2`'s build script) to generate Rust FFI bindings
        # from llama.cpp's C++ headers. Windows runners ship LLVM at
        # `C:\Program Files\LLVM`; macOS picks up libclang from Xcode.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev

      # Fase 3.4: CUDA Toolkit and Vulkan SDK are required at compile time on
      # Windows + Linux because `llama-cpp-2` is built with `cuda` and `vulkan`
      # features there (see src-tauri/Cargo.toml). The Vulkan branch of
      # `llama-cpp-sys-2`'s build script hard-`expect`s `VULKAN_SDK` on Windows.
      # macOS uses `metal` (Xcode-shipped frameworks); no extra install needed.
      #
      # Pinned versions:
      #   - CUDA 12.6.0 — conservative pin matching llama.cpp's tested matrix
      #     for `llama-cpp-sys-2` v0.1.145; CUDA 13.x is too new to assume.
      #   - Vulkan SDK 1.3.290.0 — recent stable, widely available, supports
      #     all GPU vendors we target.
      - name: Install CUDA Toolkit
        if: matrix.os != 'macos-latest'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Install Vulkan SDK
        if: matrix.os != 'macos-latest'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.3.290.0'
          install_runtime: true
          cache: true
          stripdown: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Fase 3.5: GPU backends are opt-in Cargo features so local devs without
      # all the SDKs can build. CI always builds the production feature combo
      # for the target OS so the shipped artifacts match what users get.
      - name: Set GPU features for this OS
        id: features
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "flags=--features metal" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--features cuda,vulkan" >> "$GITHUB_OUTPUT"
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked ${{ steps.features.outputs.flags }} -- -D warnings

      - name: Check
        run: cargo check --all-targets --locked ${{ steps.features.outputs.flags }}

      - name: Test
        run: cargo test --locked ${{ steps.features.outputs.flags }}

      - name: Verify specta bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --bin export_bindings ${{ steps.features.outputs.flags }}
          git diff --exit-code ../src/lib/tauri/bindings.ts
