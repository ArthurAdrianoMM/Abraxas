name: CI

on:
  push:
    branches: [main]
  pull_request:
  # O `gpu-build` roda com cache quente quase sempre, o que significa que ele
  # valida o *nosso* codigo mas nao revalida a toolchain (CUDA, Vulkan SDK,
  # imagem do runner, deps transitivas do llama.cpp). Uma vez por semana ele
  # roda frio, do zero, pra que apodrecimento de toolchain apareca num job
  # agendado em vez de estourar na primeira tag de release.
  schedule:
    - cron: '0 6 * * 1'
  # Pra disparar o CI a mao (o `gpu-build` roda sempre aqui, sem o filtro de
  # paths) antes de cortar uma tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Portao de ~15s pro `gpu-build`. Nada fora de `src-tauri/` e do proprio
    # workflow consegue quebrar o link do combo `cuda,vulkan` — mudanca de
    # frontend, de docs ou do catalogo nao justifica acordar um runner Windows
    # com CUDA Toolkit. Job pulado por `if:` conta como sucesso em branch
    # protection, entao isso nao trava merge.
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ steps.filter.outputs.gpu }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Fora de push/PR (schedule, workflow_dispatch) nao existe diff pra
          # comparar: roda sempre. Idem quando a base e desconhecida (primeiro
          # push de uma branch, force-push) — na duvida, rodar.
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base indisponivel — rodando gpu-build por precaucao."
            echo "gpu=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Arquivos alterados:"; echo "$changed"

          if grep -qE '^(src-tauri/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "gpu=true" >> "$GITHUB_OUTPUT"
          else
            echo "gpu=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  rust:
    # Fast lane: fmt, clippy, check, test on all 3 OS using the CPU-only
    # default feature set. The CUDA + Vulkan compile is a ~30 min nvcc job
    # on a cache miss. Tests don't exercise GPU code paths, so forcing every
    # PR to wait on a full GPU compile is pure overhead.
    # (Nota historica: o "Failed to restore: Cache service responded with 400"
    # que aparecia aqui foi diagnosticado — nao e instabilidade do runner
    # Windows, e o cache interno do `Jimver/cuda-toolkit` batendo na v1 da API
    # de cache, ja desligada. Ver o job `gpu-build`.)
    # The dedicated `gpu-build` job below validates the GPU feature combo.
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        # `libclang-dev` is required by `bindgen` (pulled in by
        # `llama-cpp-sys-2`'s build script) to generate Rust FFI bindings
        # from llama.cpp's C++ headers. Windows runners ship LLVM at
        # `C:\Program Files\LLVM`; macOS picks up libclang from Xcode.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # macOS keeps `metal` because the frameworks ship with Xcode (no extra
      # install, negligible build cost). Linux/Windows use no GPU features
      # here — that's what the `gpu-build` job covers.
      #
      # `dev-bins` is always on here. The helper binaries carry
      # `required-features = ["dev-bins"]` so they stay out of the installer
      # (see src-tauri/Cargo.toml), which also means `clippy --all-targets` and
      # `cargo test` would silently skip them — including the unit tests inside
      # `export_bindings` — unless the feature is enabled.
      - name: Set features for this OS
        id: features
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "flags=--features metal,dev-bins" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--features dev-bins" >> "$GITHUB_OUTPUT"
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked ${{ steps.features.outputs.flags }} -- -D warnings

      - name: Test
        run: cargo test --locked ${{ steps.features.outputs.flags }}

      - name: Verify specta bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --bin export_bindings ${{ steps.features.outputs.flags }}
          git diff --exit-code ../src/lib/tauri/bindings.ts

  gpu-build:
    # Validates the production feature combo (`cuda,vulkan`) compiles on
    # Windows + Linux. Runs `cargo check` only — no clippy, no tests — to
    # avoid duplicating work the `rust` job already did with CPU features.
    #
    # `CMAKE_CUDA_ARCHITECTURES=75` builds kernels for a single SM (Turing)
    # instead of llama.cpp's default fat-binary set covering ~6 archs. This
    # cuts nvcc time roughly 5-10x. Production release builds (separate
    # workflow, not here) should use the full arch list so end-user GPUs
    # of any generation are supported; CI just needs to prove it links.
    name: GPU build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.gpu == 'true'
    # Sem isso o default e 6h. O caminho quente e ~3 min e o frio (semanal) fica
    # em ~35 min; 45 mata job travado sem matar o build agendado legitimo.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `windows-2022`, nao `windows-latest`: o `windows-latest` migrou pro
        # Windows Server 2025 com Visual Studio 2026, e o pacote
        # `visual_studio_integration` do CUDA 12.6 so instala o toolset MSBuild
        # ate o VS2022. Com o VS2026 o CMake aborta em `enable_language(CUDA)`
        # com "No CUDA toolset found". Repin quando o CUDA passar a suportar VS2026.
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    env:
      CMAKE_CUDA_ARCHITECTURES: '75'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev

      # CUDA install must be split per-OS because the Jimver action's
      # sub-package names map differently on each platform:
      #   - Windows: needs `visual_studio_integration` so MSBuild finds the
      #     CUDA toolset (.props/.targets). Without it, llama.cpp's CMake
      #     fails with "No CUDA toolset found" when enabling the CUDA
      #     language for VS2022.
      #   - Linux (Ubuntu 24.04): NVIDIA renamed cuBLAS debs to
      #     `libcublas-12-6` / `libcublas-dev-12-6`. The action's
      #     `cublas`/`cublas_dev` aliases still resolve to the old
      #     `cuda-cublas-*` names and apt fails with "Unable to locate
      #     package". Install nvcc+cudart via the action and pull cuBLAS
      #     from apt directly.
      #
      # O instalador do CUDA no Windows custa ~5 min por run. A action tem
      # cache proprio (`use-github-cache`, default true), mas ele fala com a
      # v1 da API de cache do GitHub, que foi desligada — o passo loga
      # `##[warning]Failed to restore: Cache service responded with 400` e
      # rebaixa pra download completo em *toda* execucao. (Esse e o mesmo 400
      # que o comentario do job `rust` acima atribuia a instabilidade do
      # runner Windows; nao e intermitente, e a API morta.) Por isso o
      # `use-github-cache: false` — desliga a tentativa inutil — e o cache
      # real fica por conta do `actions/cache@v4`, que usa a v2.
      #
      # A chave nao tem `hashFiles`: o conteudo depende so da versao do CUDA e
      # da lista de sub-pacotes, ambos literais aqui. Mudou um, muda a chave.
      - name: Cache CUDA Toolkit (Windows)
        id: cuda-cache
        if: matrix.os == 'windows-2022'
        uses: actions/cache@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6
          key: cuda-12.6.0-windows-2022-nvcc-cudart-cublas-v1

      - name: Install CUDA Toolkit (Windows)
        if: matrix.os == 'windows-2022' && steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          use-github-cache: false

      # Num cache hit o passo acima nao roda, entao ninguem exporta as
      # variaveis que a action normalmente define. O `FindCUDAToolkit` do CMake
      # localiza o toolkit por `CUDA_PATH` ou por `nvcc` no PATH; os dois sao
      # suficientes sob o gerador Ninja. O que o cache *nao* traz de volta e o
      # `visual_studio_integration` (ele instala .props/.targets dentro do
      # diretorio do VS, fora do dir do CUDA) — irrelevante aqui, porque esses
      # arquivos so sao lidos pelo gerador Visual Studio, que abandonamos.
      - name: Expose cached CUDA Toolkit (Windows)
        if: matrix.os == 'windows-2022' && steps.cuda-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          root='C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6'
          echo "CUDA_PATH=$root" >> "$GITHUB_ENV"
          echo "$root\\bin" >> "$GITHUB_PATH"
          nvcc="$root\\bin\\nvcc.exe"
          if [[ ! -f "/c/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.6/bin/nvcc.exe" ]]; then
            echo "::error::Cache hit mas $nvcc nao existe — cache corrompido."
            exit 1
          fi

      - name: Install CUDA Toolkit (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'
          use-github-cache: false

      - name: Install cuBLAS (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libcublas-12-6 libcublas-dev-12-6

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.3.290.0'
          install_runtime: true
          cache: true
          stripdown: true

      # Two Windows-only quirks of the llama.cpp build, both rooted in
      # `vulkan-shaders-gen` being compiled as a host tool via
      # `ExternalProject_Add`.
      #
      # CMAKE_GENERATOR=Ninja: under the Visual Studio generator MSBuild runs
      # that target's custom build steps on parallel nodes without honoring
      # their order — `install` fires before `configure` has written
      # `cmake_install.cmake`, and the build dies with MSB8066. Ninja walks the
      # ExternalProject stamp graph in dependency order. The `cmake` crate
      # honors this env var, dropping `-G "Visual Studio 17 2022"`/`-Ax64` and
      # passing the absolute `cl.exe` path via `-DCMAKE_{C,CXX,ASM}_COMPILER`
      # plus the MSVC INCLUDE/LIB environment, which nvcc needs anyway. Ninja
      # is preinstalled on the windows-2022 image.
      #
      # CARGO_TARGET_DIR: Ninja actually runs CMake's compiler ABI try-compile
      # (the VS generator reports it as "skipped"), which nests two more levels
      # under the already deep ExternalProject prefix:
      #   ...\vulkan-shaders-gen-build\CMakeFiles\CMakeScratch\
      #   TryCompile-XXXXXX\CMakeFiles\cmTC_XXXXX.dir\
      # CMake measured that directory at 239 chars against its 250 limit, and
      # cl.exe then failed with "C1083: Cannot open compiler generated file:
      # ''" — a /Fd path truncated at MAX_PATH. The default
      # `D:\a\Abraxas\Abraxas\src-tauri\target` eats 37 chars of that
      # budget; `D:\ct` eats 5, bringing the directory to ~207. Same volume as
      # the workspace, so free space is unchanged.
      #
      # Must run before `rust-cache`: the action hashes every env var prefixed
      # `CMAKE`/`CARGO` into its key, so a cache saved under the old generator
      # and target dir is not reused. That matters because the cache holds
      # `llama-cpp-sys-2`'s OUT_DIR and the `cmake` crate skips reconfiguration
      # whenever `CMakeCache.txt` already exists.
      - name: Windows build environment (Ninja + short target dir)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_DIR=D:\ct' >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Distinct key prefix from the `rust` job — the build artifacts
          # are incompatible (different feature set, different CUDA env).
          prefix-key: gpu-build
          # rust-cache resolves the target dir relative to the workspace root
          # (`path.join(root, target)`), so it cannot follow CARGO_TARGET_DIR
          # out to `D:\ct`. Leaving this on would silently archive an empty
          # `src-tauri\target` on Windows. The cargo registry is still cached.
          # O passo `actions/cache` abaixo cobre `D:\ct` no lugar dele.
          cache-targets: ${{ matrix.os == 'windows-2022' && 'false' || 'true' }}

      # O que torna este job caro no Windows nao e o Rust — e o OUT_DIR do
      # `llama-cpp-sys-2`: o CMake do llama.cpp compilando kernels CUDA com
      # nvcc e gerando os shaders Vulkan. Sem cache isso e ~26 min em *todo*
      # push (medido no run 33316912563, cancelado antes de terminar). Com
      # cache o `cmake` crate ve o `CMakeCache.txt` e pula reconfiguracao e
      # recompilacao, exatamente como ja acontece no runner Linux — onde o job
      # inteiro fecha em 1m24s.
      #
      # Precisa ser `actions/cache` e nao o `rust-cache`: o alvo esta em
      # `D:\ct` (ver o passo de MAX_PATH acima) e o `rust-cache` so enxerga
      # caminhos sob a workspace.
      #
      # A chave inclui o proprio `ci.yml` porque `CMAKE_GENERATOR`,
      # `CMAKE_CUDA_ARCHITECTURES` e as versoes de CUDA/Vulkan vivem nele: se
      # qualquer um mudar, o `CMakeCache.txt` antigo esta errado e reusa-lo
      # produziria um build silenciosamente configurado com os valores velhos.
      # As `restore-keys` degradam de proposito — um hit parcial (Cargo.lock
      # novo, ci.yml igual) ainda entrega o llama.cpp compilado, que e 90% do
      # custo; so os crates Rust recompilam.
      #
      # O run agendado ignora o cache de proposito pra validar o caminho frio
      # (ver o `schedule:` no topo). Ele ainda salva, entao a semana seguinte
      # comeca quente.
      - name: Cache llama.cpp CUDA/Vulkan build output (Windows)
        if: matrix.os == 'windows-2022' && github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: D:\ct
          key: gpu-ct-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            gpu-ct-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-
            gpu-ct-${{ matrix.os }}-

      - name: Check (cuda,vulkan)
        run: cargo check --locked --features cuda,vulkan
