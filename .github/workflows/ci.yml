name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  rust:
    # Fast lane: fmt, clippy, check, test on all 3 OS using the CPU-only
    # default feature set. The CUDA + Vulkan compile is a ~30 min nvcc job
    # that recompiles on every cache miss (the GitHub cache service is
    # flaky on Windows; "Failed to restore: Cache service responded with
    # 400" was seen in practice). Tests don't exercise GPU code paths, so
    # forcing every PR to wait on full GPU compile is pure overhead.
    # The dedicated `gpu-build` job below validates the GPU feature combo.
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        # `libclang-dev` is required by `bindgen` (pulled in by
        # `llama-cpp-sys-2`'s build script) to generate Rust FFI bindings
        # from llama.cpp's C++ headers. Windows runners ship LLVM at
        # `C:\Program Files\LLVM`; macOS picks up libclang from Xcode.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # macOS keeps `metal` because the frameworks ship with Xcode (no extra
      # install, negligible build cost). Linux/Windows use no GPU features
      # here — that's what the `gpu-build` job covers.
      - name: Set features for this OS
        id: features
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "flags=--features metal" >> "$GITHUB_OUTPUT"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked ${{ steps.features.outputs.flags }} -- -D warnings

      - name: Test
        run: cargo test --locked ${{ steps.features.outputs.flags }}

      - name: Verify specta bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --bin export_bindings ${{ steps.features.outputs.flags }}
          git diff --exit-code ../src/lib/tauri/bindings.ts

  gpu-build:
    # Validates the production feature combo (`cuda,vulkan`) compiles on
    # Windows + Linux. Runs `cargo check` only — no clippy, no tests — to
    # avoid duplicating work the `rust` job already did with CPU features.
    #
    # `CMAKE_CUDA_ARCHITECTURES=75` builds kernels for a single SM (Turing)
    # instead of llama.cpp's default fat-binary set covering ~6 archs. This
    # cuts nvcc time roughly 5-10x. Production release builds (separate
    # workflow, not here) should use the full arch list so end-user GPUs
    # of any generation are supported; CI just needs to prove it links.
    name: GPU build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # `windows-2022`, nao `windows-latest`: o `windows-latest` migrou pro
        # Windows Server 2025 com Visual Studio 2026, e o pacote
        # `visual_studio_integration` do CUDA 12.6 so instala o toolset MSBuild
        # ate o VS2022. Com o VS2026 o CMake aborta em `enable_language(CUDA)`
        # com "No CUDA toolset found". Repin quando o CUDA passar a suportar VS2026.
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    env:
      CMAKE_CUDA_ARCHITECTURES: '75'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev

      # CUDA install must be split per-OS because the Jimver action's
      # sub-package names map differently on each platform:
      #   - Windows: needs `visual_studio_integration` so MSBuild finds the
      #     CUDA toolset (.props/.targets). Without it, llama.cpp's CMake
      #     fails with "No CUDA toolset found" when enabling the CUDA
      #     language for VS2022.
      #   - Linux (Ubuntu 24.04): NVIDIA renamed cuBLAS debs to
      #     `libcublas-12-6` / `libcublas-dev-12-6`. The action's
      #     `cublas`/`cublas_dev` aliases still resolve to the old
      #     `cuda-cublas-*` names and apt fails with "Unable to locate
      #     package". Install nvcc+cudart via the action and pull cuBLAS
      #     from apt directly.
      - name: Install CUDA Toolkit (Windows)
        if: matrix.os == 'windows-2022'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Install CUDA Toolkit (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Install cuBLAS (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libcublas-12-6 libcublas-dev-12-6

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.3.290.0'
          install_runtime: true
          cache: true
          stripdown: true

      # llama.cpp builds `vulkan-shaders-gen` as a host tool through
      # `ExternalProject_Add`. Under the Visual Studio generator MSBuild runs
      # that target's custom build steps on parallel nodes without honoring
      # their order: the `install` step fires before `configure` has written
      # `cmake_install.cmake`, and the build dies with
      #   CMake error : Not a file: .../vulkan-shaders-gen-build/cmake_install.cmake
      #   error MSB8066: Custom build for '...vulkan-shaders-gen-install.rule'
      # Ninja walks the ExternalProject stamp graph in dependency order, so the
      # race is gone. The `cmake` crate honors `CMAKE_GENERATOR`: it then drops
      # `-G "Visual Studio 17 2022"`/`-Ax64` and instead passes the absolute
      # `cl.exe` path via `-DCMAKE_{C,CXX,ASM}_COMPILER` plus the MSVC
      # INCLUDE/LIB environment, which is what nvcc and glslc need anyway.
      # Ninja is preinstalled on the windows-2022 image. Linux keeps the
      # default Unix Makefiles generator, which never had the problem.
      #
      # Must run before `rust-cache` so the var lands in the cache key (the
      # action hashes every env var prefixed `CMAKE`): a cache saved under the
      # old generator holds `llama-cpp-sys-2`'s OUT_DIR, and the `cmake` crate
      # skips reconfiguration whenever `CMakeCache.txt` already exists.
      - name: Use Ninja generator (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Distinct key prefix from the `rust` job — the build artifacts
          # are incompatible (different feature set, different CUDA env).
          prefix-key: gpu-build

      - name: Check (cuda,vulkan)
        run: cargo check --locked --features cuda,vulkan
