name: CI

on:
  push:
    branches: [main]
  pull_request:
  # O `gpu-build` roda com cache quente quase sempre, o que significa que ele
  # valida o *nosso* codigo mas nao revalida a toolchain (CUDA, Vulkan SDK,
  # imagem do runner, deps transitivas do llama.cpp). Uma vez por semana ele
  # roda frio, do zero, pra que apodrecimento de toolchain apareca num job
  # agendado em vez de estourar na primeira tag de release.
  schedule:
    - cron: '0 6 * * 1'
  # Pra disparar o CI a mao (o `gpu-build` roda sempre aqui, sem o filtro de
  # paths) antes de cortar uma tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Portao de ~15s pros dois jobs caros: `gpu-build` e `bundle`. Nada fora de
    # `src-tauri/` e do proprio workflow consegue quebrar o link do combo
    # `cuda,vulkan` nem o empacotamento — mudanca de frontend, de docs ou do
    # catalogo nao justifica acordar um runner Windows com CUDA Toolkit. Job
    # pulado por `if:` conta como sucesso em branch protection, entao isso nao
    # trava merge.
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      src_tauri: ${{ steps.filter.outputs.src_tauri }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Fora de push/PR (schedule, workflow_dispatch) nao existe diff pra
          # comparar: roda sempre. Idem quando a base e desconhecida (primeiro
          # push de uma branch, force-push) — na duvida, rodar.
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base indisponivel — rodando os jobs caros por precaucao."
            echo "src_tauri=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Arquivos alterados:"; echo "$changed"

          if grep -qE '^(src-tauri/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "src_tauri=true" >> "$GITHUB_OUTPUT"
          else
            echo "src_tauri=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  rust:
    # Fast lane: fmt, clippy, check, test on all 3 OS using the CPU-only
    # default feature set. The CUDA + Vulkan compile is a ~30 min nvcc job
    # on a cache miss. Tests don't exercise GPU code paths, so forcing every
    # PR to wait on a full GPU compile is pure overhead.
    # (Nota historica: o "Failed to restore: Cache service responded with 400"
    # que aparecia aqui foi diagnosticado — nao e instabilidade do runner
    # Windows, e o cache interno do `Jimver/cuda-toolkit` batendo na v1 da API
    # de cache, ja desligada. Ver o job `gpu-build`.)
    # The dedicated `gpu-build` job below validates the GPU feature combo.
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        # `libclang-dev` is required by `bindgen` (pulled in by
        # `llama-cpp-sys-2`'s build script) to generate Rust FFI bindings
        # from llama.cpp's C++ headers. Windows runners ship LLVM at
        # `C:\Program Files\LLVM`; macOS picks up libclang from Xcode.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # macOS keeps `metal` because the frameworks ship with Xcode (no extra
      # install, negligible build cost). Linux/Windows use no GPU features
      # here — that's what the `gpu-build` job covers.
      #
      # As features vem qualificadas por pacote (`abraxas/metal`,
      # `abraxas-devtools/metal`) porque os comandos abaixo usam `--workspace`:
      # com mais de um pacote selecionado, um nome nu seria ambiguo. O
      # `abraxas-devtools` so repassa a feature pro `abraxas`, mas listar os
      # dois deixa explicito que ambos compilam com o mesmo backend.
      - name: Set features for this OS
        id: features
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "flags=--features abraxas/metal,abraxas-devtools/metal" >> "$GITHUB_OUTPUT"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Format check
        run: cargo fmt --all --check

      # `--workspace`: as ferramentas de desenvolvimento vivem no membro
      # `devtools/` (fora do alcance do bundler do Tauri — ver
      # src-tauri/Cargo.toml). Sem a flag, clippy e os testes unitarios dentro
      # do `export_bindings` seriam silenciosamente pulados.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked ${{ steps.features.outputs.flags }} -- -D warnings

      - name: Test
        run: cargo test --workspace --locked ${{ steps.features.outputs.flags }}

      # Guarda contra a regressao que quebrou a v0.1.1 nos tres OS: o bundler
      # do Tauri copia pro instalador todo alvo `[[bin]]` do pacote `abraxas` e
      # ignora `required-features`, entao um `src/bin/foo.rs` novo ou vira peso
      # morto no bundle ou faz o `cargo tauri build` morrer procurando um
      # binario que ninguem compilou. Roda em ~1s, sem compilar nada.
      - name: Guard against extra binaries in the app crate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          bins=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "abraxas") | .targets[]
                     | select(.kind[] == "bin") | .name' \
            | sort | paste -sd, -)
          if [[ "$bins" != "abraxas" ]]; then
            echo "::error::O pacote \`abraxas\` declara os binarios [$bins]; o bundler do Tauri espera exatamente um (\`abraxas\`) e copia os demais pro instalador. Mova ferramentas auxiliares pro crate src-tauri/devtools."
            exit 1
          fi
          echo "OK: o pacote abraxas declara apenas o binario 'abraxas'."

      - name: Verify specta bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked -p abraxas-devtools --bin export_bindings ${{ steps.features.outputs.flags }}
          git diff --exit-code ../src/lib/tauri/bindings.ts

  gpu-build:
    # Validates the production feature combo (`cuda,vulkan`) builds *and links*
    # on Windows + Linux. No clippy, no tests — that would duplicate the work
    # the `rust` job already did with CPU features.
    #
    # `cargo build`, nao `cargo check`: o `check` para na analise de tipos e
    # nunca invoca o linker, que e onde os objetos CUDA do llama.cpp quebram
    # (ver `CMAKE_POSITION_INDEPENDENT_CODE` no `env` abaixo). O custo extra e
    # o codegen + link do proprio crate; o nvcc, que domina o tempo do job, ja
    # rodava no `check` porque e trabalho de build script.
    #
    # `CMAKE_CUDA_ARCHITECTURES=75-real` builds kernels for a single SM
    # (Turing) instead of llama.cpp's default fat-binary set covering ~6 archs.
    # This cuts nvcc time roughly 5-10x. The release workflow uses the real
    # end-user arch list; CI just needs to prove it links.
    name: GPU build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.src_tauri == 'true'
    # Sem isso o default e 6h. O caminho quente e ~3 min e o frio (semanal) fica
    # em ~35 min; 45 mata job travado sem matar o build agendado legitimo.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `windows-2022`, nao `windows-latest`: o `windows-latest` migrou pro
        # Windows Server 2025 com Visual Studio 2026, e o pacote
        # `visual_studio_integration` do CUDA 12.8 so instala o toolset MSBuild
        # ate o VS2022. Com o VS2026 o CMake aborta em `enable_language(CUDA)`
        # com "No CUDA toolset found". Repin quando o CUDA passar a suportar VS2026.
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    env:
      # `-real` (cubin sem PTX) pelo mesmo motivo do release.yml, e uma unica
      # arquitetura porque aqui o objetivo e provar que compila e *linka*, nao
      # cobrir GPUs de usuario.
      CMAKE_CUDA_ARCHITECTURES: '75-real'
      # Sem isso o link do executavel falha no Linux com "relocation
      # R_X86_64_PC32 cannot be used against symbol 'stderr'; recompile with
      # -fPIC": os objetos `.cu` do llama.cpp nao sao PIC por default e o
      # binario e PIE. Foi exatamente assim que a tag v0.1.0 morreu no Linux,
      # depois de 1h25 de build — este job so nao pegou porque rodava
      # `cargo check`, que nao chega a linkar.
      CMAKE_POSITION_INDEPENDENT_CODE: 'ON'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev

      # CUDA install must be split per-OS because the Jimver action's
      # sub-package names map differently on each platform:
      #   - Windows: needs `visual_studio_integration` so MSBuild finds the
      #     CUDA toolset (.props/.targets). Without it, llama.cpp's CMake
      #     fails with "No CUDA toolset found" when enabling the CUDA
      #     language for VS2022.
      #   - Linux (Ubuntu 24.04): NVIDIA renamed cuBLAS debs to
      #     `libcublas-12-8` / `libcublas-dev-12-8`. The action's
      #     `cublas`/`cublas_dev` aliases still resolve to the old
      #     `cuda-cublas-*` names and apt fails with "Unable to locate
      #     package". Install nvcc+cudart via the action and pull cuBLAS
      #     from apt directly.
      #
      # O instalador do CUDA no Windows custa ~5 min por run. A action tem
      # cache proprio (`use-github-cache`, default true), mas ele fala com a
      # v1 da API de cache do GitHub, que foi desligada — o passo loga
      # `##[warning]Failed to restore: Cache service responded with 400` e
      # rebaixa pra download completo em *toda* execucao. (Esse e o mesmo 400
      # que o comentario do job `rust` acima atribuia a instabilidade do
      # runner Windows; nao e intermitente, e a API morta.) Por isso o
      # `use-github-cache: false` — desliga a tentativa inutil — e o cache
      # real fica por conta do `actions/cache@v4`, que usa a v2.
      #
      # A chave nao tem `hashFiles`: o conteudo depende so da versao do CUDA e
      # da lista de sub-pacotes, ambos literais aqui. Mudou um, muda a chave.
      - name: Cache CUDA Toolkit (Windows)
        id: cuda-cache
        if: matrix.os == 'windows-2022'
        uses: actions/cache@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8
          key: cuda-12.8.0-windows-2022-nvcc-cudart-cublas-v1

      - name: Install CUDA Toolkit (Windows)
        if: matrix.os == 'windows-2022' && steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          use-github-cache: false

      # Num cache hit o passo acima nao roda, entao ninguem exporta as
      # variaveis que a action normalmente define. O `FindCUDAToolkit` do CMake
      # localiza o toolkit por `CUDA_PATH` ou por `nvcc` no PATH; os dois sao
      # suficientes sob o gerador Ninja. O que o cache *nao* traz de volta e o
      # `visual_studio_integration` (ele instala .props/.targets dentro do
      # diretorio do VS, fora do dir do CUDA) — irrelevante aqui, porque esses
      # arquivos so sao lidos pelo gerador Visual Studio, que abandonamos.
      - name: Expose cached CUDA Toolkit (Windows)
        if: matrix.os == 'windows-2022' && steps.cuda-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          root='C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'
          echo "CUDA_PATH=$root" >> "$GITHUB_ENV"
          echo "$root\\bin" >> "$GITHUB_PATH"
          nvcc="$root\\bin\\nvcc.exe"
          if [[ ! -f "/c/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8/bin/nvcc.exe" ]]; then
            echo "::error::Cache hit mas $nvcc nao existe — cache corrompido."
            exit 1
          fi

      - name: Install CUDA Toolkit (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'
          use-github-cache: false

      - name: Install cuBLAS (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libcublas-12-8 libcublas-dev-12-8

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.3.290.0'
          install_runtime: true
          cache: true
          stripdown: true

      # Two Windows-only quirks of the llama.cpp build, both rooted in
      # `vulkan-shaders-gen` being compiled as a host tool via
      # `ExternalProject_Add`.
      #
      # CMAKE_GENERATOR=Ninja: under the Visual Studio generator MSBuild runs
      # that target's custom build steps on parallel nodes without honoring
      # their order — `install` fires before `configure` has written
      # `cmake_install.cmake`, and the build dies with MSB8066. Ninja walks the
      # ExternalProject stamp graph in dependency order. The `cmake` crate
      # honors this env var, dropping `-G "Visual Studio 17 2022"`/`-Ax64` and
      # passing the absolute `cl.exe` path via `-DCMAKE_{C,CXX,ASM}_COMPILER`
      # plus the MSVC INCLUDE/LIB environment, which nvcc needs anyway. Ninja
      # is preinstalled on the windows-2022 image.
      #
      # CARGO_TARGET_DIR: Ninja actually runs CMake's compiler ABI try-compile
      # (the VS generator reports it as "skipped"), which nests two more levels
      # under the already deep ExternalProject prefix:
      #   ...\vulkan-shaders-gen-build\CMakeFiles\CMakeScratch\
      #   TryCompile-XXXXXX\CMakeFiles\cmTC_XXXXX.dir\
      # CMake measured that directory at 239 chars against its 250 limit, and
      # cl.exe then failed with "C1083: Cannot open compiler generated file:
      # ''" — a /Fd path truncated at MAX_PATH. The default
      # `D:\a\Abraxas\Abraxas\src-tauri\target` eats 37 chars of that
      # budget; `D:\ct` eats 5, bringing the directory to ~207. Same volume as
      # the workspace, so free space is unchanged.
      #
      # Must run before `rust-cache`: the action hashes every env var prefixed
      # `CMAKE`/`CARGO` into its key, so a cache saved under the old generator
      # and target dir is not reused. That matters because the cache holds
      # `llama-cpp-sys-2`'s OUT_DIR and the `cmake` crate skips reconfiguration
      # whenever `CMakeCache.txt` already exists.
      - name: Windows build environment (Ninja + short target dir)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_DIR=D:\ct' >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Distinct key prefix from the `rust` job — the build artifacts
          # are incompatible (different feature set, different CUDA env).
          prefix-key: gpu-build
          # rust-cache resolves the target dir relative to the workspace root
          # (`path.join(root, target)`), so it cannot follow CARGO_TARGET_DIR
          # out to `D:\ct`. Leaving this on would silently archive an empty
          # `src-tauri\target` on Windows. The cargo registry is still cached.
          # O passo `actions/cache` abaixo cobre `D:\ct` no lugar dele.
          cache-targets: ${{ matrix.os == 'windows-2022' && 'false' || 'true' }}

      # O que torna este job caro no Windows nao e o Rust — e o OUT_DIR do
      # `llama-cpp-sys-2`: o CMake do llama.cpp compilando kernels CUDA com
      # nvcc e gerando os shaders Vulkan. Sem cache isso e ~26 min em *todo*
      # push (medido no run 33316912563, cancelado antes de terminar). Com
      # cache o `cmake` crate ve o `CMakeCache.txt` e pula reconfiguracao e
      # recompilacao, exatamente como ja acontece no runner Linux — onde o job
      # inteiro fecha em 1m24s.
      #
      # Precisa ser `actions/cache` e nao o `rust-cache`: o alvo esta em
      # `D:\ct` (ver o passo de MAX_PATH acima) e o `rust-cache` so enxerga
      # caminhos sob a workspace.
      #
      # A chave inclui o proprio `ci.yml` porque `CMAKE_GENERATOR`,
      # `CMAKE_CUDA_ARCHITECTURES` e as versoes de CUDA/Vulkan vivem nele: se
      # qualquer um mudar, o `CMakeCache.txt` antigo esta errado e reusa-lo
      # produziria um build silenciosamente configurado com os valores velhos.
      # As `restore-keys` degradam de proposito — um hit parcial (Cargo.lock
      # novo, ci.yml igual) ainda entrega o llama.cpp compilado, que e 90% do
      # custo; so os crates Rust recompilam.
      #
      # O run agendado ignora o cache de proposito pra validar o caminho frio
      # (ver o `schedule:` no topo). Ele ainda salva, entao a semana seguinte
      # comeca quente.
      - name: Cache llama.cpp CUDA/Vulkan build output (Windows)
        if: matrix.os == 'windows-2022' && github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: D:\ct
          key: gpu-ct-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            gpu-ct-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-
            gpu-ct-${{ matrix.os }}-

      - name: Build (cuda,vulkan)
        run: cargo build --locked --features cuda,vulkan

  bundle:
    # O buraco que deixou a v0.1.1 quebrar: nenhum job do CI chegava a rodar
    # `tauri build`, entao a fase de *empacotamento* so era exercitada depois
    # que uma tag ja tinha queimado ~90 min de nvcc. O `cargo build` do
    # `gpu-build` compila e linka, mas nunca monta o `.app`/`.deb` — e era ali
    # que o bundler morria procurando `export_bindings`.
    #
    # `--debug`: o bundler percorre exatamente o mesmo caminho (enumera os
    # alvos `[[bin]]` do pacote, copia os binarios, monta o pacote) no perfil
    # de debug, entao o valor de deteccao e o mesmo por uma fracao do tempo de
    # um build release.
    #
    # Features default (CPU): nenhum SDK de GPU envolvido. O que esta sendo
    # testado e o empacotamento, nao o backend de inferencia.
    #
    # `deb,appimage` e `ubuntu-22.04` espelham exatamente o job Linux do
    # release.yml. Na v0.1.2 este job cobria so o `deb` e passou, enquanto o
    # release quebrou no `appimage` (`failed to run linuxdeploy`) — um smoke
    # test de empacotamento que nao empacota o mesmo conjunto de alvos do
    # release nao e um smoke test do release.
    #
    # `--verbose` de proposito: o erro do linuxdeploy chega ao log do tauri sem
    # a saida do subprocesso, e sem ela um AppImage quebrado custa uma iteracao
    # inteira pra diagnosticar.
    name: Bundle smoke test
    needs: changes
    if: needs.changes.outputs.src_tauri == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        # `libfuse2` como no release.yml: o linuxdeploy e distribuido como
        # AppImage e precisa de FUSE 2 pra se automontar.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libclang-dev \
            libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A chave default do rust-cache distingue `runner.os` ("Linux") e o
          # id do job, mas nao a versao da imagem. Este job roda em 22.04
          # enquanto os demais rodam em `ubuntu-latest` (24.04), e sem um
          # sufixo proprio o cache de um e restaurado no outro: os build
          # scripts ja compilados voltam linkados contra a glibc errada e
          # morrem em "version `GLIBC_2.39' not found".
          #
          # Literal, e nao `${{ env.ImageOS }}`: o contexto `env` so enxerga
          # variaveis declaradas no proprio workflow, nao o ambiente do runner,
          # entao `ImageOS` resolveria pra string vazia e a chave nao mudaria.
          # Mantenha em sincronia com o `runs-on` acima.
          key: ubuntu-22.04

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle (debug, CPU-only)
        run: pnpm tauri build --verbose --debug --bundles deb,appimage

      - name: Show disk usage
        # O binario de release com a lista de arquiteturas CUDA passa de meio
        # giga, e o linuxdeploy copia tudo pro AppDir antes de comprimir. Se o
        # AppImage falhar por espaco, o numero tem que estar no log.
        if: always()
        run: df -h . && du -sh src-tauri/target/debug/bundle/* 2>/dev/null || true

      # O bundler nao falha se um binario *extra* entrar no pacote — ele so o
      # copia junto, que foi como a v0.1.0 despachou 13 MB de `export_bindings`
      # dentro do `.app`. A checagem do conteudo tem que ser explicita.
      - name: Verify the package ships only the app binary
        shell: bash
        # `-e`/`pipefail` de proposito fora: um `grep` sem match sai 1 e mataria
        # o passo antes de imprimir o diagnostico. Os erros aqui sao tratados na
        # mao.
        run: |
          set -uo pipefail
          deb=$(ls src-tauri/target/debug/bundle/deb/*.deb) || {
            echo "::error::nenhum .deb em src-tauri/target/debug/bundle/deb/"
            exit 1
          }
          echo "Inspecionando $deb"

          listing=$(dpkg-deb -c "$deb")
          echo "--- conteudo do pacote ---"
          echo "$listing"
          echo "--------------------------"

          # Arquivos regulares apenas: no `dpkg-deb -c` a primeira coluna e o
          # modo, e entradas de diretorio comecam com `d`.
          files=$(awk '$1 !~ /^d/ { print $NF }' <<<"$listing")

          # Sanidade primeiro: sem o binario da aplicacao, a checagem seguinte
          # passaria alegremente num pacote vazio. Case-insensitive porque o
          # bundler nomeia o executavel conforme o `productName` ("Abraxas") ou
          # o alvo do cargo ("abraxas") dependendo da versao/plataforma.
          if ! grep -qiE '/abraxas$' <<<"$files"; then
            echo "::error::binario da aplicacao ausente no .deb — a verificacao abaixo nao teria valor."
            exit 1
          fi

          # A propriedade que interessa: nenhuma ferramenta de desenvolvimento
          # entrou no pacote. Vale em qualquer diretorio, entao continua correta
          # se o bundler mudar o layout (/usr/bin vs /usr/lib/<app>).
          if strays=$(grep -E '/(export_bindings|llama_smoke)$' <<<"$files"); then
            echo "::error::o .deb carrega ferramentas de desenvolvimento: $(paste -sd, - <<<"$strays"). Elas devem viver em src-tauri/devtools, fora do pacote que o bundler enxerga."
            exit 1
          fi

          # O AppImage nao e inspecionado por dentro (exigiria montar/extrair);
          # o que importa aqui e que o linuxdeploy rodou ate o fim, que e onde o
          # release da v0.1.2 morreu.
          appimage=$(ls src-tauri/target/debug/bundle/appimage/*.AppImage 2>/dev/null)
          if [[ -z "$appimage" ]]; then
            echo "::error::o bundler nao produziu um .AppImage — ver a saida do linuxdeploy acima."
            exit 1
          fi
          echo "AppImage gerado: $appimage ($(du -h "$appimage" | cut -f1))"

          echo "OK: pacotes montados, com o binario da aplicacao e sem ferramentas de desenvolvimento."
