name: Publish model catalog

on:
  push:
    branches: [main]
    paths:
      - 'model-catalog/**'
      - '.github/workflows/publish-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog JSON
        run: |
          python - <<'PY'
          import json, sys
          with open('model-catalog/catalog.json', 'r', encoding='utf-8') as f:
              c = json.load(f)
          assert c.get('schema_version') == 1, f"schema_version must be 1, got {c.get('schema_version')!r}"
          assert isinstance(c.get('models'), list), "models must be a list"
          ids = [m['id'] for m in c['models']]
          assert len(ids) == len(set(ids)), "duplicate ids in models"
          print(f"OK: schema_version=1, {len(ids)} model(s)")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: model-catalog

      - id: deploy
        uses: actions/deploy-pages@v4
