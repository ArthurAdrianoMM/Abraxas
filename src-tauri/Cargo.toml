[package]
name = "abraxas"
version = "0.1.1"
description = "Abraxas — local-first desktop chat with open-source LLMs."
license = "MIT"
edition = "2021"

# O bundler do Tauri copia pro instalador *todo* alvo `[[bin]]` deste pacote e
# ignora `required-features`, entao qualquer binario auxiliar aqui vira ou peso
# morto no bundle (o `Abraxas.app` da v0.1.0 levou um `export_bindings` de
# 13 MB) ou uma quebra do `cargo tauri build` (a v0.1.1, que tentou gatear os
# auxiliares por feature). Ferramentas de desenvolvimento vao pro membro
# `devtools/`, fora do alcance do bundler.
#
# A raiz do workspace e o proprio `src-tauri/` (e nao a raiz do repo) pra que o
# target dir continue em `src-tauri/target/`: e de la que o `tauri-action` puxa
# os bundles, que o `Swatinem/rust-cache` chaveia (`workspaces: src-tauri`) e
# que o passo de verificacao do dmg no release.yml le o `.app`.
[workspace]
members = ["devtools"]

[lib]
# The `_lib` suffix is required so the lib name doesn't collide with the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "abraxas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fase 3.2: `dyn InferenceBackend` is used by Fase 3.3's manager. Native
# async-fn-in-trait is not object-safe with the standard signatures, so the
# trait is annotated with `#[async_trait]`, which boxes futures internally.
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = "0.2"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "migrate", "macros", "time"] }
specta = { version = "2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.11"
tauri-specta = { version = "2.0.0-rc.22", features = ["derive", "typescript"] }
sysinfo = "0.33"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
# Fase 4.1: catalog fetch over HTTPS. `rustls-tls` is preferred over the
# default `native-tls` so Linux CI doesn't need OpenSSL headers and Windows
# doesn't depend on Schannel quirks. Fase 4.3 enables `stream` for chunked
# GGUF downloads via `Response::bytes_stream`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Fase 4.3: chunked file I/O during model downloads. Tauri pulls tokio in
# transitively; declaring it as a direct dep with explicit features avoids
# relying on the transitive feature set.
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt", "macros"] }
# StreamExt for `reqwest::Response::bytes_stream` consumption.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# `encoding_rs` provides the stateful UTF-8 decoder passed to
# `LlamaModel::token_to_piece`, which correctly stitches multi-byte
# tokens that span byte boundaries (mirrors the upstream `examples/simple`
# in llama-cpp-rs).
encoding_rs = "0.8"

# `raw-cpuid` issues the x86 `CPUID` instruction, so it only builds on x86
# targets. Gating it here keeps aarch64 (Apple Silicon, ARM Linux) building.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11"

# Fase 3.4 / 3.5: GPU backends are exposed as opt-in Cargo features so a
# developer with only one toolchain installed (e.g. NVIDIA + CUDA but no
# Vulkan SDK) can still build locally. `default = []` means a bare
# `cargo check` produces a CPU-only build with no SDK requirements.
#
# Production / release builds enable the full per-OS combo via CI:
#   - Windows + Linux: `--features cuda,vulkan`  (one binary, runtime selects)
#   - macOS:           `--features metal`
# See `.github/workflows/ci.yml` for the canonical invocations.
#
# `default-features = false` is preserved on the dep entries to drop upstream
# `openmp` (needs `brew install libomp` on macOS) and `android-shared-stdcxx`
# (Android-only). The CPU fallback uses llama.cpp's internal std::thread pool.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.145", default-features = false }

# GPU probing is only relevant off macOS (Metal is assumed via `cfg!(target_os)`).
# `nvml-wrapper` dynamically loads `libnvidia-ml`; absent driver => clean error.
# `ash` dynamically loads the Vulkan loader; absent loader => clean error.
# Neither links system libs at build time, so they're safe to keep unconditional.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
llama-cpp-2 = { version = "0.1.145", default-features = false }
nvml-wrapper = "0.10"
ash = "0.38"

[features]
# CPU-only by default — no SDK required to `cargo check` a fresh clone.
default = []
# Enables the corresponding ggml backend in `llama-cpp-2`. Each one has a
# build-time SDK requirement: `cuda` needs CUDA Toolkit (CUDA_PATH);
# `vulkan` needs Vulkan SDK (VULKAN_SDK); `metal` needs Xcode (macOS only).
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]

[dev-dependencies]
# The main `tokio` dep already enables fs/io-util/sync/time/rt/macros; tests
# additionally need `net` (TCP listener for the in-process HTTP test server)
# and `rt-multi-thread` (multi-threaded `#[tokio::test]` runtime). Cargo
# unions features, so the production build does not pull `net` in.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }
tempfile = "3"

