[package]
name = "abraxas"
version = "0.1.0"
description = "Abraxas — local-first desktop chat with open-source LLMs."
edition = "2021"

[lib]
# The `_lib` suffix is required so the lib name doesn't collide with the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "abraxas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = "0.2"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "migrate", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"

