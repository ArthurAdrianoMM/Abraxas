[package]
name = "abraxas"
version = "0.1.0"
description = "Abraxas — local-first desktop chat with open-source LLMs."
edition = "2021"
default-run = "abraxas"

[lib]
# The `_lib` suffix is required so the lib name doesn't collide with the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "abraxas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = "0.2"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "migrate", "macros", "time"] }
specta = { version = "2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.11"
tauri-specta = { version = "2.0.0-rc.22", features = ["derive", "typescript"] }
sysinfo = "0.33"

# `raw-cpuid` issues the x86 `CPUID` instruction, so it only builds on x86
# targets. Gating it here keeps aarch64 (Apple Silicon, ARM Linux) building.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11"

# GPU probing is only relevant off macOS (Metal is assumed via `cfg!(target_os)`).
# `nvml-wrapper` dynamically loads `libnvidia-ml`; absent driver => clean error.
# `ash` dynamically loads the Vulkan loader; absent loader => clean error.
# Neither links system libs at build time, so CI runners need nothing extra.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
nvml-wrapper = "0.10"
ash = "0.38"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"

