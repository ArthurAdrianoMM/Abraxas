<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abraxas — escolha do modelo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="_design-system.css">

<style>
  /* =========================================================================
     MODEL RECOMMENDATION — "the deck"
     A hand of cards spread across the table. The recommended card sits
     centered, larger, gilded; the rest fan behind like a tarot spread.
     Cards borrow playing-card structure (corner indices, inner frame, a
     central emblem) but in Abraxas dress: bordeaux/brass on parchment-black,
     italic display serif, mono for ledger details.
     ========================================================================= */

  body{ overflow:hidden; }

  .page{
    position:fixed; inset:0;
    display:grid;
    grid-template-rows: 1fr auto;
    background:
      radial-gradient(140% 100% at 50% -10%, #100b0a 0%, #080605 65%, #050302 100%);
  }

  /* corner micro-meta */
  .corner{
    position:absolute;
    z-index:5;
    font-family:var(--mono);
    font-size:9.5px;
    color:var(--mute-2);
    letter-spacing:0.22em;
    text-transform:uppercase;
    pointer-events:none;
  }
  .corner.tl{ top:22px; left:28px; }
  .corner.tr{
    top:22px; left:50%; transform:translateX(-50%);
    display:inline-flex; align-items:center;
    color:var(--mute);
  }
  .corner.bl{ bottom:20px; left:28px; }
  .corner.br{ bottom:20px; right:28px; }

  /* ======================== TABLE / DECK ======================== */
  .table{
    position:relative;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    perspective: 1600px;
    padding: 40px 0 60px;
    min-height: 0;
  }

  /* faint felt grain on the table */
  .table::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(60% 50% at 50% 55%, rgba(184,153,104,0.04) 0%, transparent 70%);
    pointer-events:none;
  }

  /* a thin gilded baseline the cards rest on */
  .table::after{
    content:"";
    position:absolute;
    left:50%; bottom:8px;
    transform:translateX(-50%);
    width:60%;
    height:1px;
    background:
      linear-gradient(90deg,
        transparent 0%,
        rgba(184,153,104,0.0) 8%,
        rgba(184,153,104,0.35) 50%,
        rgba(184,153,104,0.0) 92%,
        transparent 100%);
    pointer-events:none;
  }

  .deck{
    position:relative;
    width:100%;
    height:100%;
    display:flex; align-items:center; justify-content:center;
    transform-style: preserve-3d;
  }

  /* ======================== CARD ======================== */
  .card{
    --w: 280px;
    --h: 408px;
    position:absolute;
    width:var(--w);
    height:var(--h);
    left:50%;
    top:50%;
    margin-left: calc(var(--w) * -0.5);
    margin-top:  calc(var(--h) * -0.5);

    background:
      linear-gradient(180deg, #14100e 0%, #100c0b 60%, #0c0908 100%);
    border:1px solid var(--line-2);
    border-radius:10px;
    box-shadow:
      0 14px 36px -18px rgba(0,0,0,0.85),
      0 2px 0 0 rgba(0,0,0,0.4) inset,
      0 0 0 1px rgba(255,255,255,0.015) inset;

    cursor:pointer;
    transition:
      transform .55s cubic-bezier(.2,.7,.2,1),
      opacity .45s ease,
      filter .45s ease,
      box-shadow .45s ease,
      border-color .45s ease;
    will-change: transform, opacity;
    user-select:none;
    /* lock card-internal layout so content height never changes the box */
    overflow:hidden;
    contain: layout paint;
  }

  /* the inner frame — the playing-card "hairline" inside the border */
  .card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(184,153,104,0.18);
    border-radius:5px;
    pointer-events:none;
  }

  /* corner index — playing-card style, mirrored on opposite corner */
  .card .index{
    position:absolute;
    font-family:var(--display);
    font-style:italic;
    font-weight:500;
    color:var(--ink-2);
    line-height:1;
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .card .index .glyph{
    font-size:22px;
    letter-spacing:0.02em;
  }
  .card .index .pip{
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:0.16em;
    color:var(--mute);
    text-transform:uppercase;
  }
  .card .index.tl{ top:18px; left:18px; }
  .card .index.br{ bottom:18px; right:18px; transform:rotate(180deg); }

  /* on recommended cards, the banner replaces the corner indices visually */
  .card[data-recommended="true"] .index{ display:none; }

  /* central emblem — the suit, hermetic-style */
  .card .emblem{
    position:absolute;
    left:50%; top:46%;
    transform:translate(-50%, -50%);
    width:118px; height:118px;
    display:grid; place-items:center;
    opacity:.85;
  }
  .card .emblem svg{ width:100%; height:100%; }

  /* the card content — name, label, rationale, tags, footprint */
  .card .content{
    position:absolute;
    left:0; right:0; bottom:0;
    /* fixed-height bottom block so emblem placement is identical on every card */
    height: 196px;
    padding: 0 24px 22px;
    display:flex; flex-direction:column; justify-content:flex-end; gap:8px;
    text-align:center;
  }
  .card .name{
    font-family:var(--display);
    font-style:italic;
    font-weight:500;
    font-size:24px;
    line-height:1.1;
    color:var(--ink);
    letter-spacing:0.005em;
    margin:0;
    text-wrap:balance;
  }
  .card .name-mono{
    font-family:var(--mono);
    font-size:10px;
    color:var(--mute);
    letter-spacing:0.16em;
    text-transform:uppercase;
  }
  .card .rule{
    width:36px; height:1px;
    background:rgba(184,153,104,0.45);
    margin:2px auto 0;
  }
  .card .rationale{
    font-family:var(--serif);
    font-style:italic;
    font-size:14px;
    line-height:1.4;
    color:var(--ink-3);
    margin:6px auto 0;
    max-width:30ch;
    text-wrap:pretty;
    /* pin to a 2-line box so cards stay equal height regardless of copy */
    height: 2.8em;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }

  /* compatibility label — top center, between corner indices */
  .card .compat{
    position:absolute;
    top:22px; left:50%;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--mute);
    display:flex; align-items:center; gap:8px;
    white-space:nowrap;
  }
  .card .compat .bullet{
    width:5px; height:5px; border-radius:50%;
    background:currentColor;
    display:inline-block;
  }
  .card[data-compat="recommended"] .compat{ color:var(--brass); }
  .card[data-compat="works"]       .compat{ color:var(--ink-3); }
  .card[data-compat="slow"]        .compat{ color:var(--mute); }
  .card[data-compat="not"]         .compat{ color:var(--bordeaux); }

  /* tag row */
  .card .tags{
    display:flex; justify-content:center; gap:6px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .card .tag{
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-3);
    border:1px solid var(--line-2);
    border-radius:3px;
    padding:3px 7px;
    background:rgba(28,22,20,0.4);
    display:inline-flex; align-items:center; gap:5px;
  }
  .card .tag b{ color:var(--brass); font-weight:500; letter-spacing:0.08em; }
  .card .tag.muted b{ color:var(--mute); }
  .card .tag.warn b{ color:var(--ink-3); }

  /* ============== POSITIONS ============== */
  /* center / active */
  .card.pos-0{
    transform: translate(0, 0) rotate(0deg) scale(1);
    z-index:5;
    opacity:1;
  }
  /* one over to either side */
  .card.pos--1{
    transform: translate(-260px, 14px) rotate(-7deg) scale(0.86);
    z-index:4;
    opacity:.85;
    filter: brightness(0.78) saturate(0.85);
  }
  .card.pos-1{
    transform: translate(260px, 14px) rotate(7deg) scale(0.86);
    z-index:4;
    opacity:.85;
    filter: brightness(0.78) saturate(0.85);
  }
  /* two over */
  .card.pos--2{
    transform: translate(-460px, 38px) rotate(-13deg) scale(0.72);
    z-index:3;
    opacity:.55;
    filter: brightness(0.6) saturate(0.7);
  }
  .card.pos-2{
    transform: translate(460px, 38px) rotate(13deg) scale(0.72);
    z-index:3;
    opacity:.55;
    filter: brightness(0.6) saturate(0.7);
  }
  /* hidden — far off-stage on either side */
  .card.pos-hidden-l{
    transform: translate(-700px, 64px) rotate(-18deg) scale(0.6);
    z-index:1;
    opacity:0;
    pointer-events:none;
  }
  .card.pos-hidden-r{
    transform: translate(700px, 64px) rotate(18deg) scale(0.6);
    z-index:1;
    opacity:0;
    pointer-events:none;
  }

  /* recommended sigil — the gilded card */
  .card[data-recommended="true"]{
    border-color: rgba(184,153,104,0.55);
    background:
      linear-gradient(180deg, #1a1310 0%, #130d0b 60%, #0d0908 100%);
    box-shadow:
      0 22px 50px -18px rgba(0,0,0,0.95),
      0 0 0 1px rgba(184,153,104,0.10) inset,
      0 0 30px -6px rgba(184,153,104,0.18);
  }
  .card[data-recommended="true"]::before{
    border-color: rgba(184,153,104,0.55);
    box-shadow:
      0 0 0 1px rgba(184,153,104,0.05) inset;
  }
  /* a small brass crown above the recommended card when it's centered */
  .card[data-recommended="true"]::after{
    content:"";
    position:absolute;
    top:-1px; left:8%; right:8%;
    height:2px;
    background:
      linear-gradient(90deg,
        transparent 0%,
        rgba(184,153,104,0) 10%,
        rgba(184,153,104,0.85) 50%,
        rgba(184,153,104,0) 90%,
        transparent 100%);
    border-radius:2px;
    pointer-events:none;
    opacity:.85;
  }
  .card[data-recommended="true"].pos-0{
    box-shadow:
      0 30px 60px -22px rgba(0,0,0,0.95),
      0 0 0 1px rgba(184,153,104,0.18) inset,
      0 0 50px -8px rgba(184,153,104,0.30);
  }

  /* on recommended cards, the banner replaces the compat label visually */
  .card[data-recommended="true"] .compat{ display:none; }

  /* recommended ribbon — sits where the compat label would be */
  .recommended-banner{
    position:absolute;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--brass);
    display:flex; align-items:center; gap:10px;
    pointer-events:none;
    white-space:nowrap;
  }
  .recommended-banner .line{
    width:18px; height:1px;
    background:var(--brass);
    opacity:.7;
  }

  /* hover — only on side cards */
  .card.pos--1:hover, .card.pos-1:hover{
    filter: brightness(0.9) saturate(0.95);
    opacity:1;
  }
  .card.pos--2:hover, .card.pos-2:hover{
    filter: brightness(0.7) saturate(0.8);
    opacity:.7;
  }

  /* ======================== FOOTER ======================== */
  .foot{
    padding: 18px 64px 36px;
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:20px;
    max-width:1280px;
    margin:0 auto;
    width:100%;
  }
  .foot .left, .foot .right{
    display:flex; align-items:center;
    gap:18px;
  }
  .foot .right{ justify-content:flex-end; }

  /* navigation arrow buttons */
  .nav-btn{
    background:transparent;
    border:1px solid var(--line-2);
    color:var(--mute);
    width:38px; height:38px;
    border-radius:50%;
    cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition: color .15s, border-color .15s, background .15s;
  }
  .nav-btn:hover{ color:var(--brass); border-color:var(--bordeaux); }
  .nav-btn:disabled{ opacity:.3; cursor:default; }
  .nav-btn:disabled:hover{ color:var(--mute); border-color:var(--line-2); }

  /* dot indicator (which card is centered) */
  .dots{
    display:flex; gap:10px; align-items:center;
  }
  .dot-btn{
    background:transparent; border:0;
    width:18px; height:18px;
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .dot-btn .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--mute-2);
    transition: background .2s, transform .2s;
  }
  .dot-btn:hover .dot{ background:var(--ink-3); }
  .dot-btn[data-active="true"] .dot{
    background:var(--brass);
    transform:scale(1.4);
  }

  /* counter */
  .counter{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.18em;
    color:var(--mute-2);
    text-transform:uppercase;
    min-width:60px;
    text-align:center;
  }
  .counter b{ color:var(--ink-2); font-weight:500; }

  /* ghost back link */
  .ghost-link{
    background:transparent; border:0;
    color:var(--mute);
    font-family:var(--serif);
    font-style:italic;
    font-size:14px;
    cursor:pointer;
    padding:6px 2px;
    letter-spacing:0.01em;
    transition: color .15s;
    display:inline-flex; align-items:center; gap:8px;
  }
  .ghost-link:hover{ color:var(--brass); }

  /* primary action — Use this model */
  .use-btn{
    background:transparent;
    border:1px solid var(--bordeaux);
    color:var(--brass);
    padding:13px 26px;
    min-width:170px;
    font-family:var(--serif);
    font-size:15px;
    font-style:italic;
    font-weight:500;
    letter-spacing:0.02em;
    border-radius:4px;
    cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:12px;
    white-space:nowrap;
    transition: background .18s, color .18s, border-color .18s;
  }
  .use-btn:hover{
    background:var(--bg-hover);
    color:var(--ink);
  }
  .use-btn .arrow{ display:inline-flex; align-items:center; transition: transform .18s; }
  .use-btn:hover .arrow{ transform: translateX(3px); }

  /* tweaks panel sits above the foot */
  .twk-panel{ bottom:120px !important; }

  /* ---- responsive ---- */
  @media (max-width: 1080px){
    .foot{ padding: 18px 32px 28px; }
    .card{ --w: 240px; --h: 360px; }
    .card.pos--1{ transform: translate(-220px, 12px) rotate(-7deg) scale(0.84); }
    .card.pos-1 { transform: translate( 220px, 12px) rotate( 7deg) scale(0.84); }
    .card.pos--2{ transform: translate(-380px, 32px) rotate(-13deg) scale(0.7); }
    .card.pos-2 { transform: translate( 380px, 32px) rotate( 13deg) scale(0.7); }
  }
  @media (max-width: 760px){
    body{ overflow:auto; }
    .page{ position:static; min-height:100vh; }
    .table{ min-height: 520px; }
    .card{ --w: 220px; --h: 332px; }
    .card.pos--1, .card.pos-1{
      opacity:.5;
    }
    .card.pos--1{ transform: translate(-150px, 8px) rotate(-9deg) scale(0.7); }
    .card.pos-1 { transform: translate( 150px, 8px) rotate( 9deg) scale(0.7); }
    .card.pos--2, .card.pos-2{ opacity:0; pointer-events:none; }
    .foot{
      grid-template-columns: 1fr;
      padding: 18px 22px 28px;
      gap:14px;
    }
    .foot .left, .foot .right{ justify-content:center; }
  }
</style>
</head>
<body>

<h2 class="sr-only">Abraxas — recomendação de modelo</h2>

<span class="corner tl">abraxas · v.0</span>
<span class="corner tr">
  <svg class="glyph" width="14" height="14" viewBox="0 0 32 32" fill="none" aria-hidden="true" style="vertical-align:middle;margin-right:8px">
    <circle cx="16" cy="16" r="13" stroke="#b89968" stroke-width="0.9" fill="none"/>
    <circle cx="16" cy="16" r="9.5" stroke="#7d2233" stroke-width="0.7" fill="none"/>
    <line x1="16" y1="1.5" x2="16" y2="30.5" stroke="#b89968" stroke-width="0.9"/>
    <circle cx="16" cy="11" r="1.3" fill="#b89968"/>
  </svg>
  passo 03 · <span style="color:var(--brass)">a escolha do modelo</span>
</span>
<span class="corner bl">passo 03 / 04</span>


<div class="page" data-screen-label="01 Model Recommendation">

  <!-- ============== TABLE ============== -->
  <main class="table" id="table">
    <div class="deck" id="deck"><!-- cards injected --></div>
  </main>

  <!-- ============== FOOTER ============== -->
  <footer class="foot">
    <div class="left">
      <button class="ghost-link" id="backBtn" type="button">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <path d="M13 8H3M7 4 3 8l4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        voltar ao exame
      </button>
    </div>

    <div class="dots-wrap" style="display:flex; align-items:center; gap:18px;">
      <button class="nav-btn" id="prevBtn" type="button" aria-label="anterior">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M10 4 6 8l4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="counter"><b id="counterIdx">1</b> / <span id="counterTotal">5</span></span>
      <button class="nav-btn" id="nextBtn" type="button" aria-label="próximo">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="right">
      <div class="dots" id="dots"><!-- injected --></div>
      <button class="use-btn" id="useBtn" type="button">
        <span>confirmar</span>
        <span class="arrow" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
    </div>
  </footer>

</div>

<!-- ============== EMBLEM SVGs (referenced by symbol) ============== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- I. Sun — fast, light, small -->
    <symbol id="emb-sun" viewBox="0 0 100 100">
      <g fill="none" stroke="#b89968" stroke-width="0.9">
        <circle cx="50" cy="50" r="14"/>
        <circle cx="50" cy="50" r="22" opacity="0.4"/>
        <g stroke-linecap="round">
          <line x1="50" y1="14" x2="50" y2="22"/>
          <line x1="50" y1="78" x2="50" y2="86"/>
          <line x1="14" y1="50" x2="22" y2="50"/>
          <line x1="78" y1="50" x2="86" y2="50"/>
          <line x1="25" y1="25" x2="31" y2="31"/>
          <line x1="69" y1="69" x2="75" y2="75"/>
          <line x1="75" y1="25" x2="69" y2="31"/>
          <line x1="31" y1="69" x2="25" y2="75"/>
        </g>
        <circle cx="50" cy="50" r="3" fill="#b89968" stroke="none"/>
      </g>
    </symbol>

    <!-- II. Moon — quiet, small, careful -->
    <symbol id="emb-moon" viewBox="0 0 100 100">
      <g fill="none" stroke="#b89968" stroke-width="0.9">
        <path d="M62 22 a30 30 0 1 0 0 56 a22 22 0 1 1 0 -56 z"/>
        <circle cx="38" cy="38" r="1.6" fill="#b89968" stroke="none"/>
        <circle cx="42" cy="58" r="1.2" fill="#b89968" stroke="none" opacity=".7"/>
        <circle cx="32" cy="50" r="1" fill="#b89968" stroke="none" opacity=".5"/>
      </g>
    </symbol>

    <!-- III. Sigil — the chosen, balance — eye in triangle -->
    <symbol id="emb-sigil" viewBox="0 0 100 100">
      <g fill="none" stroke="#b89968" stroke-width="0.9">
        <polygon points="50,16 86,80 14,80"/>
        <polygon points="50,28 76,74 24,74" opacity=".45"/>
        <ellipse cx="50" cy="60" rx="14" ry="7"/>
        <circle cx="50" cy="60" r="3.2" fill="#b89968" stroke="none"/>
        <line x1="50" y1="16" x2="50" y2="28" stroke-linecap="round" opacity=".55"/>
      </g>
    </symbol>

    <!-- IV. Pillars — heavier, slower -->
    <symbol id="emb-pillars" viewBox="0 0 100 100">
      <g fill="none" stroke="#b89968" stroke-width="0.9">
        <line x1="20" y1="22" x2="80" y2="22"/>
        <line x1="22" y1="22" x2="22" y2="78"/>
        <line x1="78" y1="22" x2="78" y2="78"/>
        <line x1="20" y1="78" x2="80" y2="78"/>
        <rect x="34" y="32" width="32" height="36" opacity=".3"/>
        <line x1="36" y1="32" x2="36" y2="68" opacity=".5"/>
        <line x1="50" y1="32" x2="50" y2="68" opacity=".5"/>
        <line x1="64" y1="32" x2="64" y2="68" opacity=".5"/>
        <circle cx="50" cy="50" r="4" fill="#b89968" stroke="none" opacity=".6"/>
      </g>
    </symbol>

    <!-- V. Tower — the heaviest, the cautionary -->
    <symbol id="emb-tower" viewBox="0 0 100 100">
      <g fill="none" stroke="#b89968" stroke-width="0.9">
        <path d="M30 80 L30 38 L50 22 L70 38 L70 80 Z"/>
        <line x1="50" y1="22" x2="50" y2="80" opacity=".4"/>
        <line x1="30" y1="50" x2="70" y2="50" opacity=".4"/>
        <line x1="30" y1="64" x2="70" y2="64" opacity=".4"/>
        <line x1="40" y1="38" x2="40" y2="50" opacity=".5"/>
        <line x1="60" y1="38" x2="60" y2="50" opacity=".5"/>
        <circle cx="50" cy="14" r="2.5" fill="#b89968" stroke="none"/>
        <line x1="50" y1="16" x2="50" y2="22"/>
      </g>
    </symbol>
  </defs>
</svg>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
  /* =========================================================================
     Model Recommendation — deck carousel
     ========================================================================= */

  // ---- model catalog : five archetypes for a hand of cards ----
  const MODELS = [
    {
      id:'phi-3-mini',
      name:'Phi-3 Mini',
      monoName:'phi-3-mini · 3.8B',
      roman:'I',
      glyph:'☉',
      pip:'sol',
      emblem:'#emb-sun',
      compat:{ optimal:'works', medium:'works',       low:'recommended', error:'works' },
      rationale:'A mais leve do baralho. Acende rápido, mesmo em máquinas modestas.',
      speed:'rápido',
      quality:'básico',
      download:'3.8 GB',
      total:'3.8 GB',
    },
    {
      id:'gemma-2-2b',
      name:'Gemma 2',
      monoName:'gemma-2 · 2B',
      roman:'II',
      glyph:'☽',
      pip:'lua',
      emblem:'#emb-moon',
      compat:{ optimal:'works', medium:'recommended', low:'works',       error:'works' },
      rationale:'Pequena, atenta, educada. Boa para conversa do dia-a-dia.',
      speed:'rápido',
      quality:'bom',
      download:'1.6 GB',
      total:'2.2 GB',
    },
    {
      id:'llama-3-1-8b',
      name:'Llama 3.1',
      monoName:'llama-3.1 · 8B',
      roman:'III',
      glyph:'△',
      pip:'sigilo',
      emblem:'#emb-sigil',
      compat:{ optimal:'recommended', medium:'works', low:'slow', error:'works' },
      rationale:'O melhor equilíbrio para este computador. Forte sem ficar lenta.',
      speed:'equilibrado',
      quality:'forte',
      download:'7.3 GB',
      total:'7.3 GB',
    },
    {
      id:'mistral-7b',
      name:'Mistral',
      monoName:'mistral · 7B',
      roman:'IV',
      glyph:'▌▐',
      pip:'colunas',
      emblem:'#emb-pillars',
      compat:{ optimal:'works',       medium:'slow', low:'not', error:'works' },
      rationale:'Sólida e direta. Boa em código e respostas objetivas.',
      speed:'equilibrado',
      quality:'forte',
      download:'5.1 GB',
      total:'5.1 GB',
    },
    {
      id:'qwen-2-5-14b',
      name:'Qwen 2.5',
      monoName:'qwen-2.5 · 14B',
      roman:'V',
      glyph:'▲',
      pip:'torre',
      emblem:'#emb-tower',
      compat:{ optimal:'works', medium:'slow', low:'not', error:'slow' },
      rationale:'Maior qualidade do baralho — mas pede tempo e memória.',
      speed:'devagar',
      quality:'forte',
      download:'6.2 GB',
      total:'6.2 GB',
    },
  ];

  const COMPAT_LABELS = {
    recommended: 'recomendado',
    works:       'roda bem',
    slow:        'pode ficar lento',
    not:         'não recomendado',
  };

  /* ---------- DOM helpers ---------- */
  const $deck     = document.getElementById('deck');
  const $prev     = document.getElementById('prevBtn');
  const $next     = document.getElementById('nextBtn');
  const $back     = document.getElementById('backBtn');
  const $use      = document.getElementById('useBtn');
  const $cIdx     = document.getElementById('counterIdx');
  const $cTotal   = document.getElementById('counterTotal');
  const $dots     = document.getElementById('dots');

  /* ---------- state ---------- */
  let tier = 'optimal';
  let activeIdx = 0;       // current centered card index
  let recommendedIdx = 2;  // index of the recommended model under current tier

  /* ---------- helpers ---------- */
  function recommendedIndexFor(tier){
    const i = MODELS.findIndex(m => m.compat[tier] === 'recommended');
    return i === -1 ? 0 : i;
  }

  function tagsFor(model){
    const speedClass =
      model.speed === 'rápido'     ? '' :
      model.speed === 'equilibrado'? '' :
      'warn';
    const qualityClass =
      model.quality === 'forte' ? '' :
      model.quality === 'bom'   ? '' :
      'muted';
    return `
      <span class="tag ${speedClass}">vel · <b>${model.speed}</b></span>
      <span class="tag ${qualityClass}">qual · <b>${model.quality}</b></span>
    `;
  }

  function buildCards(){
    $deck.innerHTML = MODELS.map((m, i) => {
      const compat = m.compat[tier];
      const isRec = (compat === 'recommended');
      return `
        <article class="card" data-idx="${i}" data-compat="${compat}" data-recommended="${isRec ? 'true':'false'}" role="button" tabindex="0" aria-label="${m.name}, ${COMPAT_LABELS[compat]}">

          ${isRec ? '<span class="recommended-banner"><span class="line"></span>recomendado para você<span class="line"></span></span>' : ''}

          <span class="compat"><span class="bullet"></span>${COMPAT_LABELS[compat]}</span>

          <span class="index tl"><span class="glyph">${m.roman}</span><span class="pip">${m.pip}</span></span>
          <span class="index br"><span class="glyph">${m.roman}</span><span class="pip">${m.pip}</span></span>

          <span class="emblem"><svg viewBox="0 0 100 100"><use href="${m.emblem}"></use></svg></span>

          <div class="content">
            <h3 class="name">${m.name}</h3>
            <span class="name-mono">${m.total}</span>
            <span class="rule"></span>
            <p class="rationale">${m.rationale}</p>
            <div class="tags">${tagsFor(m)}</div>
          </div>
        </article>`;
    }).join('');

    // attach listeners
    $deck.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        const idx = parseInt(card.dataset.idx, 10);
        if(idx === activeIdx) return;
        setActive(idx);
      });
      card.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          e.stopPropagation();
          const idx = parseInt(card.dataset.idx, 10);
          if(idx === activeIdx) confirmUse();
          else setActive(idx);
        }
      });
    });
  }

  function buildDots(){
    $dots.innerHTML = MODELS.map((m, i) =>
      `<button class="dot-btn" data-idx="${i}" type="button" aria-label="ir para ${m.name}"><span class="dot"></span></button>`
    ).join('');
    $dots.querySelectorAll('.dot-btn').forEach(b =>
      b.addEventListener('click', () => setActive(parseInt(b.dataset.idx,10)))
    );
    $cTotal.textContent = MODELS.length;
  }

  function layout(){
    $deck.querySelectorAll('.card').forEach(card => {
      const i = parseInt(card.dataset.idx, 10);
      const d = i - activeIdx;
      // remove all pos-* classes first
      card.classList.remove('pos--2','pos--1','pos-0','pos-1','pos-2','pos-hidden-l','pos-hidden-r');
      if(d === 0)        card.classList.add('pos-0');
      else if(d === -1)  card.classList.add('pos--1');
      else if(d ===  1)  card.classList.add('pos-1');
      else if(d === -2)  card.classList.add('pos--2');
      else if(d ===  2)  card.classList.add('pos-2');
      else if(d <  -2)   card.classList.add('pos-hidden-l');
      else               card.classList.add('pos-hidden-r');
    });

    // dots
    $dots.querySelectorAll('.dot-btn').forEach(b => {
      const i = parseInt(b.dataset.idx,10);
      b.dataset.active = (i === activeIdx) ? 'true' : 'false';
    });

    $cIdx.textContent = activeIdx + 1;

    // arrows
    $prev.disabled = (activeIdx === 0);
    $next.disabled = (activeIdx === MODELS.length - 1);

    // CTA name (button label is fixed; no dynamic resize)
  }

  function setActive(i){
    activeIdx = Math.max(0, Math.min(MODELS.length - 1, i));
    layout();
  }

  function confirmUse(){
    // hand off to the download ceremony (passo 04)
    window.location.href = 'Abraxas Download.html';
  }

  /* ---------- events ---------- */
  $prev.addEventListener('click', () => setActive(activeIdx - 1));
  $next.addEventListener('click', () => setActive(activeIdx + 1));
  $back.addEventListener('click', () => { window.location.href = 'Abraxas Computer Check.html'; });
  $use .addEventListener('click', confirmUse);

  document.addEventListener('keydown', (e) => {
    // don't hijack keys meant for form fields, buttons or links
    if (e.target.closest('input, textarea, select')) return;
    if(e.key === 'ArrowLeft')  { e.preventDefault(); setActive(activeIdx - 1); }
    if(e.key === 'ArrowRight') { e.preventDefault(); setActive(activeIdx + 1); }
    if(e.key === 'Enter' && !e.target.closest('button, a, [role="button"]')) { confirmUse(); }
  });

  // ---- swipe / drag on the deck ----
  let dragStartX = null;
  $deck.addEventListener('pointerdown', e => {
    if(e.target.closest('.card.pos-0')) return; // let the active card breathe
    dragStartX = e.clientX;
  });
  document.addEventListener('pointerup', e => {
    if(dragStartX === null) return;
    const dx = e.clientX - dragStartX;
    if(Math.abs(dx) > 40){
      setActive(activeIdx + (dx < 0 ? 1 : -1));
    }
    dragStartX = null;
  });

  // touch on whole table for nicer swipe
  let touchX = null;
  document.getElementById('table').addEventListener('touchstart', e => {
    touchX = e.touches[0].clientX;
  }, {passive:true});
  document.getElementById('table').addEventListener('touchend', e => {
    if(touchX === null) return;
    const dx = (e.changedTouches[0].clientX) - touchX;
    if(Math.abs(dx) > 40){
      setActive(activeIdx + (dx < 0 ? 1 : -1));
    }
    touchX = null;
  });

  /* ---------- tier change ---------- */
  function applyTier(newTier){
    tier = newTier;
    recommendedIdx = recommendedIndexFor(tier);
    activeIdx = recommendedIdx;
    buildCards();
    layout();
  }

  /* ---------- Tweaks ---------- */
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "tier": "optimal"
  }/*EDITMODE-END*/;

  function App(){
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

    React.useEffect(() => {
      applyTier(t.tier);
    }, [t.tier]);

    return (
      <TweaksPanel title="Tweaks">
        <TweakSection label="Hardware do exame" />
        <TweakRadio
          label="Resultado"
          value={t.tier}
          options={['optimal','medium','low','error']}
          onChange={(v) => setTweak('tier', v)}
        />
      </TweaksPanel>
    );
  }

  // initial build (tier may be overridden right away by useTweaks)
  buildDots();
  applyTier('optimal');

  const tweakRoot = document.createElement('div');
  document.body.appendChild(tweakRoot);
  ReactDOM.createRoot(tweakRoot).render(<App />);
</script>
</body>
</html>
